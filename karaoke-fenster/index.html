<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>♪ KARAOKE</title>
<style>
  :root { --bg: #12041a; --pink: #ff3d81; --gold: #ffd23f; --cyan: #2de2e6; --violet: #9b5cff; --text: #fff6fb; --muted: #d3a9c6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden;
    padding: 70px 20px 20px; position: relative;
  }
  /* wandernde Farbflecken wie Disco-Licht */
  .blobs { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .blobs i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .35; animation: drift 18s ease-in-out infinite alternate; }
  .blobs i:nth-child(1) { background: var(--pink); left: -15vmax; top: -20vmax; }
  .blobs i:nth-child(2) { background: var(--violet); right: -20vmax; top: 10vmax; animation-duration: 23s; }
  .blobs i:nth-child(3) { background: var(--cyan); left: 20vmax; bottom: -35vmax; opacity: .22; animation-duration: 27s; }
  @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.15); } }
  /* aufsteigende Noten */
  .notes { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .notes span { position: absolute; bottom: -60px; font-size: 34px; opacity: 0; animation: rise 11s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) rotate(-12deg); opacity: 0; } 10% { opacity: .5; } 100% { transform: translateY(-115vh) rotate(18deg); opacity: 0; } }

  /* oben links: Absender, oben rechts: Song */
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 14px 20px; }
  .by { font-weight: 900; font-size: clamp(16px, 2.2vw, 28px); letter-spacing: .02em; transform: rotate(-3deg); }
  .by small { font-weight: 700; color: var(--muted); font-size: .62em; margin-right: .35em; text-transform: lowercase; }
  .by b { background: linear-gradient(90deg, var(--cyan), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .badge { display: none; max-width: 62vw; text-align: right; transform: rotate(2deg); }
  body.live .badge { display: block; animation: wobble 4s ease-in-out infinite; }
  .badge .art { display: inline-block; background: var(--gold); color: #2a0a18; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: clamp(11px, 1.5vw, 18px); padding: 3px 10px; border-radius: 6px; box-shadow: 3px 3px 0 var(--pink); }
  .badge .ttl { display: block; margin-top: 6px; font-weight: 900; font-size: clamp(18px, 3vw, 40px); line-height: 1.05; background: linear-gradient(90deg, var(--pink), var(--gold), var(--cyan)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear infinite; }
  .badge .note { display: block; margin-top: 4px; font-size: clamp(11px, 1.3vw, 15px); color: var(--muted); font-weight: 700; }
  @keyframes shine { to { background-position: 200% 0; } }
  @keyframes wobble { 0%,100% { transform: rotate(2deg) translateY(0); } 50% { transform: rotate(-1deg) translateY(3px); } }

  h1 { margin: 0; font-weight: 900; text-transform: uppercase; letter-spacing: .03em; line-height: .95; font-size: clamp(44px, 13vw, 190px); display: flex; justify-content: center; }
  h1 span { display: inline-block; background: linear-gradient(180deg, var(--gold), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 rgba(155, 92, 255, .55)) drop-shadow(0 0 26px rgba(255, 61, 129, .4)); animation: bounce 1.6s ease-in-out infinite; }
  h1 span:nth-child(2n) { background-image: linear-gradient(180deg, var(--cyan), var(--violet)); }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-.09em) rotate(-3deg); } }
  body.live h1 { display: none; } /* im Live-Betrieb gehoert die Mitte dem Text */

  .stage { width: 100%; max-width: 1500px; margin-top: 10px; display: none; --rh: clamp(40px, min(9.6vh, calc((100vh - 140px) / 7)), 112px); --rows: 7; }
  /* aktive Zeile = Fenstermitte, egal wie gross/klein das Fenster ist */
  body.live .stage { display: block; position: fixed; left: 0; right: 0; margin: 0 auto; top: calc(50% - var(--rh) * var(--rows) / 2); }
  .view { height: calc(var(--rh) * var(--rows, 7)); overflow: hidden; position: relative; perspective: 900px; perspective-origin: 50% 50%; }
  .rows { position: absolute; left: 0; right: 0; top: 50%; transform-style: preserve-3d; will-change: transform; }
  .row { position: relative; backface-visibility: hidden; will-change: transform, opacity; height: var(--rh); display: flex; align-items: center; justify-content: center; padding: 0 12px; white-space: nowrap; font-weight: 800; color: var(--muted); }
  .row.c { font-weight: 900; color: var(--text); }
  .w { display: inline-block; margin: 0 .07em; color: color-mix(in srgb, var(--text) 42%, transparent); transition: color .12s; }
  .w.sung { color: var(--text); }
  .w.sung:nth-child(3n) { color: var(--cyan); } .w.sung:nth-child(3n+1) { color: var(--text); } .w.sung:nth-child(3n+2) { color: #ffd1e6; }
  .w.now { color: var(--gold); text-shadow: 0 0 24px rgba(255, 210, 63, .85), 0 4px 0 var(--pink); animation: pop .28s cubic-bezier(.3,1.8,.5,1); transform: scale(1.05); }
  @keyframes pop { from { transform: scale(.8) rotate(-4deg); } to { transform: scale(1.05); } }

  .ball { position: absolute; left: 0; top: 0; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; z-index: 3; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 35% 30%, #fff, var(--gold) 45%, var(--pink)); box-shadow: 0 0 14px rgba(255, 210, 63, .9), 0 6px 0 rgba(155, 92, 255, .6); }
  .hint { margin-top: 22px; color: var(--muted); font-size: clamp(14px, 1.8vw, 22px); max-width: 38em; line-height: 1.5; }
  body.live .hint { display: none; }
  .eq { position: fixed; left: 0; right: 0; bottom: 0; height: 46px; display: none; align-items: flex-end; justify-content: center; gap: 5px; opacity: .8; pointer-events: none; }
  body.live .eq { display: flex; }
  .eq i { width: 10px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, var(--gold), var(--pink)); animation: eq 0.9s ease-in-out infinite alternate; }
  @keyframes eq { from { height: 6px; } to { height: 42px; } }
  .ctrl { position: fixed; bottom: 52px; right: 14px; display: none; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }
  body.live .ctrl { display: flex; }
  .ctrl button { background: #2a1030; color: var(--text); border: 1px solid #5a2a58; border-radius: 8px; width: 40px; height: 32px; font-size: 18px; cursor: pointer; }
  .ctrl button:hover { border-color: var(--gold); }
  .state { position: fixed; bottom: 54px; left: 14px; max-width: 70vw; font-size: 14px; line-height: 1.35; color: var(--muted); opacity: .8; }
  .state i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #5a3a4a; margin-right: 6px; }
  .state.on i { background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
  /* Dock-Modus: Seite steckt als festes Feld im Player (iframe) */
  body.dock { padding: 8px 12px 6px; justify-content: flex-start; }
  body.dock h1 { font-size: clamp(22px, 5vh, 54px); }
  body.dock .stage { margin-top: 2px; --rh: clamp(30px, 6.2vh, 64px); --rows: 5; }
  body.dock .state, body.dock .eq { display: none !important; }
  body.dock .top { padding: 6px 12px; }
  body.dock .by { font-size: clamp(12px, 1.6vw, 18px); }
  body.dock .ctrl { bottom: 6px; }
  body.dock .hint { margin-top: 8px; font-size: clamp(12px, 1.5vw, 17px); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<script>if (location.search.indexOf('dock=1') > -1) document.body.classList.add('dock');</script>
<div class="blobs"><i></i><i></i><i></i></div>
<div class="notes" id="notes"></div>
<div class="top">
  <div class="by"><small>by</small><b>driftware</b></div>
  <div class="badge" id="badge"><span class="art" id="art"></span><span class="ttl" id="ttl"></span><span class="note" id="note"></span></div>
</div>
<h1 id="h1">Karaoke</h1>
<div class="stage" id="stage"><div class="view" id="view"><div class="rows" id="rows"></div><i class="ball" id="ball"></i></div></div>
<div class="state" id="state"><i></i><span id="state-t">wartet auf den Player …</span></div>
<div class="hint" id="hint">Dieser Tab zeigt den Text zum Mitsingen. Lass ihn offen, zieh ihn bei Bedarf als eigenes Fenster heraus (auch auf einen zweiten Monitor) und starte im Player ein Lied aus der Genre-Kachel „Karaoke".</div>
<div class="eq" id="eq"></div>
<div class="ctrl" id="ctrl">Text-Versatz
  <button type="button" id="earlier" title="Text früher (−0,5 s)">−</button><span id="off">0,0 s</span><button type="button" id="later" title="Text später (+0,5 s)">+</button>
</div>
<script>
(function () {
  var OFFSET_KEY = 'driftware-lyrics-offset-v1', SCALE_KEY = 'driftware-lyrics-scale-v1';
  var chan = null;
  try { chan = new BroadcastChannel('driftware-karaoke'); } catch (e) {}
  var cur = { key: null, lines: null, msg: null, kd: 0 }, pend = {};
  var last = null, lastRecv = 0, idleInfo = null;
  var el = function (id) { return document.getElementById(id); };

  function clean(str) {
    return String(str || '').replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').replace(/\s+-\s+.*$/, '').replace(/\s+(feat\.?|ft\.?|featuring)\s+.*$/i, '').trim();
  }
  function parse(lrc) {
    var raw = [];
    String(lrc || '').split(/\r?\n/).forEach(function (row) {
      var m, re = /\[(\d+):(\d+(?:\.\d+)?)\]/g, times = [], lastIdx = 0;
      while ((m = re.exec(row))) { times.push(parseInt(m[1], 10) * 60 + parseFloat(m[2])); lastIdx = re.lastIndex; }
      var text = row.slice(lastIdx).trim();
      times.forEach(function (t) { raw.push({ t: t, text: text }); });
    });
    raw.sort(function (a, b) { return a.t - b.t; });
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      if (!raw[i].text) continue;
      var end = i + 1 < raw.length ? raw[i + 1].t : raw[i].t + 5;
      var words = raw[i].text.split(/\s+/);
      var weights = words.map(function (w) { return Math.max(2, w.replace(/[^\p{L}\p{N}]/gu, '').length) + 1; });
      out.push({ t: raw[i].t, text: raw[i].text, words: words, weights: weights,
        total: weights.reduce(function (s, w) { return s + w; }, 0),
        singEnd: Math.max(raw[i].t + 0.3, Math.min(end - 0.1, raw[i].t + words.length * 0.45 + 0.6)) });
    }
    return out;
  }
  function offsets() { try { return JSON.parse(localStorage.getItem(OFFSET_KEY)) || {}; } catch (e) { return {}; } }
  function getOff(k) { return offsets()[k] || 0; }
  function setOff(k, v) {
    try { var o = offsets(); if (Math.abs(v) < 0.01) delete o[k]; else o[k] = Math.round(v * 10) / 10; localStorage.setItem(OFFSET_KEY, JSON.stringify(o)); } catch (e) {}
  }
  function scales() { try { return JSON.parse(localStorage.getItem(SCALE_KEY)) || {}; } catch (e) { return {}; } }
  function setSc(k, v) {
    try { var o = scales(); if (!v || Math.abs(v - 1) < 0.0005) delete o[k]; else o[k] = Math.round(v * 10000) / 10000; localStorage.setItem(SCALE_KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* wirksame Werte kommen vom Player (eigene Einstellung, sonst die gemeinsame der Besucher) */
  function effOff() { return last && typeof last.off === 'number' ? last.off : (last ? getOff(last.key) : 0); }
  function effSc() { return last && last.sc > 0 ? last.sc : 1; }
  function nudge(d) { if (!last) return; var sc = effSc(); setSc(last.key, sc); setOff(last.key, effOff() + d); }
  function fmt(v) { return (v > 0 ? '+' : '') + v.toFixed(1).replace('.', ',') + ' s'; }

  function loadLyrics(s) {
    cur = { key: s.key, lines: null, msg: 'Liedtext wird gesucht …', kd: s.kd };
    var artist = clean(String(s.a || '').split(/,|&| x | und /i)[0]), title = clean(s.t);
    var url = 'https://lrclib.net/api/search?track_name=' + encodeURIComponent(title) + '&artist_name=' + encodeURIComponent(artist);
    fetch(url).then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
      if (cur.key !== s.key) return;
      var synced = (list || []).filter(function (x) { return x && x.syncedLyrics && !x.instrumental; });
      if (!synced.length) { cur.msg = 'Für diesen Song gibt es keinen synchronen Text'; return; }
      if (s.kd) synced.sort(function (a, b) { return Math.abs(a.duration - s.kd) - Math.abs(b.duration - s.kd); });
      var lines = parse(synced[0].syncedLyrics);
      if (lines.length) { cur.lines = lines; cur.msg = ''; } else cur.msg = 'Für diesen Song gibt es keinen synchronen Text';
    }).catch(function () { if (cur.key === s.key) { cur.msg = 'Liedtext-Dienst gerade nicht erreichbar'; cur.key = null; } });
  }

  if (chan) {
    chan.onmessage = function (ev) {
      var m = ev.data || {};
      lastRecv = performance.now();
      if (m.type === 'idle') { last = null; idleInfo = m.info || null; return; }
      if (m.type === 'state') {
        last = m;
        if (m.key !== cur.key && m.key !== pend.key) { pend = { key: m.key, since: performance.now() }; }
        if (pend.key === m.key && m.key !== cur.key && (m.kar || m.dur > 0 || performance.now() - pend.since > 3000)) { m.kd = m.kd || Math.round(m.dur); loadLyrics(m); pend = {}; }
      }
    };
    var hello = function () { try { chan.postMessage({ type: 'hello' }); } catch (e) {} };
    hello(); setInterval(hello, 1000);
    window.addEventListener('pagehide', function () { try { chan.postMessage({ type: 'bye' }); } catch (e) {} });
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function wordsHtml(L, nowIdx) {
    return '<span>' + L.words.map(function (w, i) { return '<span class="w' + (i < nowIdx ? ' sung' : i === nowIdx ? ' now' : '') + '">' + esc(w) + '</span>'; }).join(' ') + '</span>';
  }
  /* Walze: ALLE Zeilen liegen auf einer durchgehenden Bahn; sie gleitet fliessend nach oben, die
     aktuelle Zeile bleibt in der Mitte. Zeilen davor/danach kippen weg und werden blasser. */
  var shown = { lines: null, active: null, wi: null }, rowsEl = el('rows'), centerEl = null, rowEls = [], rhPx = 60, visFrom = 0, visTo = -1;
  function fit(row, text, base) {
    var w = rowsEl.clientWidth * 0.80, px = Math.min(base, w / Math.max(6, text.length * 0.56));
    row.style.fontSize = px + 'px';
  }
  function build(lines) {
    var vw = Math.min(window.innerWidth, 1500), html = '';
    for (var i = 0; i < lines.length; i++) html += '<div class="row" data-i="' + i + '"></div>';
    rowsEl.innerHTML = html;
    rowEls = Array.prototype.slice.call(rowsEl.children);
    rhPx = rowEls.length ? rowEls[0].offsetHeight : 60;
    var big = Math.min(vw * 0.075, window.innerHeight * 0.14, rhPx * 1.0);
    rowEls.forEach(function (row, i) { row.textContent = lines[i].text; fit(row, lines[i].text, big); row.style.visibility = 'hidden'; });
    centerEl = null; visFrom = 0; visTo = -1;
  }
  function ease(x) { return x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x); }
  /* Position p der Walze: Zeile i rollt ab (Start - 0,7 s) in 0,55 s in die Mitte */
  function rollPos(lines, t) {
    var i = -1;
    for (var k = 0; k < lines.length; k++) { if (lines[k].t - 0.7 <= t) i = k; else break; }
    if (i < 0) return -1;
    return (i - 1) + ease((t - (lines[i].t - 0.7)) / 0.6);
  }
  function paint(lines, p, active) {
    /* echte Walze: Zeilen sitzen auf einem Zylinder mit Radius R; je weiter von der Mitte, desto staerker
       gekippt, nach hinten versetzt und ausgeblendet */
    var R = rhPx * 3.4, span = 5;
    var from = Math.max(0, Math.floor(p) - span), to = Math.min(lines.length - 1, Math.ceil(p) + span);
    for (var i = visFrom; i <= visTo; i++) { if ((i < from || i > to) && rowEls[i]) rowEls[i].style.visibility = 'hidden'; }
    visFrom = from; visTo = to;
    rowsEl.style.transform = 'translateY(' + (-(p + 0.5) * rhPx) + 'px)';
    for (var j = from; j <= to; j++) {
      var row = rowEls[j]; if (!row) continue;
      var d = j - p, th = Math.max(-1.45, Math.min(1.45, d * rhPx / R));
      var y = R * Math.sin(th) - d * rhPx, z = -R * (1 - Math.cos(th));
      var mitte = Math.max(0, 1 - Math.abs(d));
      var sc = 1 + mitte * 0.14;
      row.style.visibility = 'visible';
      row.style.opacity = Math.max(0, Math.pow(Math.cos(th), 1.6)).toFixed(3);
      row.style.transform = 'translateY(' + y.toFixed(1) + 'px) translateZ(' + z.toFixed(1) + 'px) rotateX(' + (-th * 180 / Math.PI).toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      var ad = Math.abs(d);
      row.style.filter = ad > 0.8 ? 'blur(' + Math.min(2.4, (ad - 0.8) * 0.8).toFixed(2) + 'px)' : 'none';
      var isAct = j === active;
      if (isAct !== row.classList.contains('c')) {
        row.classList.toggle('c', isAct);
        if (!isAct && lines[j]) row.innerHTML = wordsHtml(lines[j], lines[j].words.length); /* fertig gesungen: alles hell, kein 'jetzt'-Wort mehr */
      }
    }
  }
  /* Huepfender Ball: springt im Bogen von Wort zu Wort der aktuellen Zeile */
  var ballEl = el('ball'), viewEl = el('view');
  function moveBall(L, wi, u) {
    if (!L || !centerEl) { ballEl.style.opacity = 0; return; }
    var spans = centerEl.querySelectorAll('.w'); if (!spans.length) { ballEl.style.opacity = 0; return; }
    var vr = viewEl.getBoundingClientRect(), n = spans.length;
    var i0 = Math.max(0, Math.min(n - 1, wi)), a = spans[i0].getBoundingClientRect();
    var ax = a.left + a.width / 2 - vr.left, ay = a.top - vr.top - 6, x = ax, y = ay;
    if (wi >= 0 && wi < n - 1) {
      var b = spans[wi + 1].getBoundingClientRect(), bx = b.left + b.width / 2 - vr.left;
      var uu = Math.max(0, Math.min(1, u)); x = ax + (bx - ax) * uu; y = ay - 4 * Math.min(26, Math.abs(bx - ax) * 0.3 + 8) * uu * (1 - uu);
    } else if (wi < 0) { y = ay - 6 - 8 * Math.abs(Math.sin(performance.now() / 180)); }
    else if (wi >= n) { ballEl.style.opacity = 0; return; }
    ballEl.style.opacity = 1; ballEl.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function tick() {
    requestAnimationFrame(tick);
    var live = !!last && performance.now() - lastRecv < 3000;
    document.body.classList.toggle('live', live);
    el('state').classList.toggle('on', !!last);
    var ago = lastRecv ? Math.round((performance.now() - lastRecv) / 100) / 10 : null;
    el('state-t').textContent = !chan ? 'Browser unterstützt keine Verbindung zum Player'
      : last ? 'verbunden – Player läuft'
      : (lastRecv && ago < 3) ? 'verbunden – aber kein Deck spielt einen Song aus der Genre-Kachel „Karaoke“. Der Player sieht: ' + (idleInfo ? idleInfo.map(function (d) { return 'Deck ' + d.k + (d.aktiv ? ' (aktiv)' : '') + ': ' + d.s + (d.playing ? ' ▶' : ' ■') + (d.kar ? ' [Karaoke]' : ' [kein Karaoke-Song]'); }).join(' | ') : '–')
      : 'KEIN SIGNAL vom Player (dieser Tab: ' + location.host + (ago !== null ? ', letztes Signal vor ' + ago + ' s' : ', noch nie ein Signal') + '). Player-Seite offen? Dann dort Cmd+Shift+R drücken – gleiche Adresse, gleiches Chrome-Profil, nicht Inkognito.';
    if (!live) { shown = { lines: null, active: null, wi: null }; return; }
    if (el('art').textContent !== last.a) el('art').textContent = last.a;
    if (el('ttl').textContent !== last.t) el('ttl').textContent = last.t;
    el('note').textContent = last.kar ? 'Studiofassung – Text läuft synchron' : 'Musikvideo – Text kann abweichen (−/+ unten rechts)';
    var t = (last.time + (last.playing ? (Date.now() - last.ts) / 1000 * (last.rate || 1) : 0) - effOff()) / effSc();
    el('off').textContent = fmt(effOff()) + (Math.abs(effSc() - 1) >= 0.0005 ? ' · Tempo ' + (effSc() * 100).toFixed(1).replace('.', ',') + ' %' : '');
    var lines = cur.lines;
    if (!lines) {
      var sig0 = 'msg:' + cur.msg;
      if (shown.lines !== sig0) { rowsEl.innerHTML = '<div class="row c" style="position:relative;top:calc(var(--rh) * -0.5);font-size:' + Math.min(window.innerWidth * 0.035, 40) + 'px">' + esc(cur.msg || '') + '</div>'; rowsEl.style.transform = 'none'; rowEls = []; shown = { lines: sig0, active: null, wi: null }; }
      ballEl.style.opacity = 0;
      return;
    }
    if (shown.lines !== lines) { build(lines); shown = { lines: lines, active: null, wi: null }; }
    var p = rollPos(lines, t);
    var active = -1;
    for (var i = 0; i < lines.length; i++) { if (lines[i].t - 0.3 <= t) active = i; else break; }
    paint(lines, p, active);
    var L = active >= 0 ? lines[active] : null, wi = -1, uw = 0;
    if (L) {
      var pr = (t - L.t) / (L.singEnd - L.t) * L.total, acc = 0;
      if (t >= L.t) { wi = 0; while (wi < L.weights.length - 1 && acc + L.weights[wi] <= pr) { acc += L.weights[wi]; wi++; } uw = (pr - acc) / L.weights[wi]; }
      if (t > L.singEnd + 0.2) wi = L.words.length;
    }
    centerEl = L ? rowEls[active] : null;
    if (centerEl && (shown.active !== active || shown.wi !== wi)) { centerEl.innerHTML = wordsHtml(L, wi); shown.active = active; shown.wi = wi; }
    else if (!centerEl && shown.active !== active) { shown.active = active; }
    moveBall(L, wi, uw);
  }
  /* Spass: Buchstaben einzeln huepfen lassen, Noten aufsteigen, Equalizer */
  (function fun() {
    var h1 = el('h1'); h1.innerHTML = 'KARAOKE'.split('').map(function (c, i) { return '<span style="animation-delay:' + (i * 0.12) + 's">' + c + '</span>'; }).join('');
    var n = el('notes'), sym = ['♪', '♫', '♬', '♩'], cols = ['#ff3d81', '#ffd23f', '#2de2e6', '#9b5cff'];
    for (var i = 0; i < 14; i++) { var s = document.createElement('span'); s.textContent = sym[i % 4]; s.style.cssText = 'left:' + (4 + i * 7) + '%;color:' + cols[i % 4] + ';animation-delay:' + (-i * 0.9) + 's;animation-duration:' + (9 + (i % 5) * 2) + 's;font-size:' + (24 + (i % 4) * 8) + 'px'; n.appendChild(s); }
    var eq = el('eq'); for (var k = 0; k < 40; k++) { var b = document.createElement('i'); b.style.animationDelay = (-(k * 0.17) % 0.9) + 's'; b.style.animationDuration = (0.6 + (k % 7) * 0.12) + 's'; eq.appendChild(b); }
  })();
  el('earlier').addEventListener('click', function () { nudge(-0.5); });
  el('later').addEventListener('click', function () { nudge(0.5); });
  requestAnimationFrame(tick);
})();
