renderDecadeIndex({
  name: 'Dinner Party',

  iconBg: 'linear-gradient(135deg, #c9a227, #7a1f3d)',
  tagline: 'Über 2600 Disco-, Funk-, Boogie- und Nu-Disco-Klassiker aus allen Jahrzehnten — eleganter Sound für Dinner, Gäste und den Abend danach.',
