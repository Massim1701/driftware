<script>
renderDecadeIndex({
  name: 'Focus & Work',
  years: 'Alle Jahrzehnte',
  icon: rawIconSVG('brain'),
  iconBg: 'linear-gradient(135deg, #4a6fa5, #2e3a59)',
  tagline: 'Ambient, Downtempo, Lo-Fi und IDM aus allen Jahrzehnten — dezenter Sound für konzentriertes Arbeiten, ohne abzulenken.',
  badgeText: rawIconSVG('brain') + ' 4 Stimmungs-Genres — Playlist-Generator live',

    accent: '#5aa9e6',

  mountBefore: '.info-note',
  dataUrl: 'songs.json?v=1',

    { key: 'Downtempo', label: 'Downtempo' },
