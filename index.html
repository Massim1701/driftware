<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftware — Apps</title>
<meta name="description" content="Driftware: kleine, unabhängige Apps ohne Schnickschnack. Foto- & Video-Editor Snoxi und weitere Projekte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1224;
    --panel: #141c33;
    --accent: #3aa8ff;
    --text: #f5f7fa;
    --muted: #9aa3c0;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 88px 24px 24px;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 0 12px;
  }
  .brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3aa8ff, #7f5aff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #0c1224;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0;
    background: linear-gradient(90deg, #3aa8ff, #7f5aff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    color: var(--muted);
    font-size: 17px;
    margin: 0;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 24px 16px;
  }
  .app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text);
  }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
  }
  .app-tile:hover .app-icon { transform: translateY(-2px); }
  .app-label {
    font-size: 12px;
    text-align: center;
    max-width: 84px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-placeholder-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .app-tile.soon {
    opacity: 0.45;
    pointer-events: none;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">D</div>
      <p class="logo">Driftware</p>
    </div>
    <p class="tagline">Kleine, unabhängige Apps ohne Schnickschnack.</p>
  </header>
  <main>
    <div class="apps">
      <a class="app-tile" href="/snoxi/">
        <img class="app-icon" src="/snoxi/icon.png" alt="Snoxi Icon">
        <span class="app-label">Snoxi</span>
      </a>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
    </div>
  </main>
  <footer>
    &copy; 2026 Driftware
    <div><a href="mailto:manca.massimo@gmail.com">Kontakt</a></div>
  </footer>
</body>
</html>
