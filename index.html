<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftware — Apps</title>
<meta name="description" content="Driftware: kleine, unabhängige Apps ohne Schnickschnack. Foto- & Video-Editor Snoxi und weitere Projekte.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1224;
    --panel: #141c33;
    --accent: #3aa8ff;
    --text: #f5f7fa;
    --muted: #9aa3c0;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 88px 24px 24px;
    text-align: center;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 0 12px;
  }
  .brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #3aa8ff, #7f5aff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: #0c1224;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin: 0;
    background: linear-gradient(90deg, #3aa8ff, #7f5aff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    color: var(--muted);
    font-size: 17px;
    margin: 0;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 24px 16px;
  }
  .app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text);
  }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    transition: transform 0.15s ease;
  }
  .app-tile:hover .app-icon { transform: translateY(-2px); }
  .app-label {
    font-size: 12px;
    text-align: center;
    max-width: 84px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-placeholder-icon {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .app-tile.soon {
    opacity: 0.45;
    pointer-events: none;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
  }
  .modal-panel h3 { margin: 0 0 12px; font-size: 17px; }
  .modal-close {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }
  .contact-email-line { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
  .contact-email-line a { color: var(--accent); }
  .contact-success {
    background: rgba(58,168,255,.12);
    border: 1px solid rgba(58,168,255,.3);
    color: var(--accent);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .contact-form { display: flex; flex-direction: column; gap: 12px; }
  .contact-form label { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
  .contact-form input, .contact-form textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
  }
  .contact-form textarea { min-height: 90px; resize: vertical; }
  .contact-form button {
    align-self: flex-start;
    background: var(--accent);
    color: #06223d;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .contact-honey { position: absolute; left: -9999px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">D</div>
      <p class="logo">Driftware</p>
    </div>
    <p class="tagline">Kleine, unabhängige Apps ohne Schnickschnack.</p>
  </header>
  <main>
    <div class="apps">
      <a class="app-tile" href="/snoxi/">
        <img class="app-icon" src="/snoxi/icon.png" alt="Snoxi Icon">
        <span class="app-label">Snoxi</span>
      </a>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
      <div class="app-tile soon">
        <div class="app-placeholder-icon">✨</div>
        <span class="app-label">Bald</span>
      </div>
    </div>
  </main>
  <footer>
    &copy; 2026 Driftware
    <div><a href="#" id="contact-link">Kontakt</a></div>
  </footer>

  <div class="modal-overlay" id="contact-modal">
    <div class="modal-panel">
      <button class="modal-close" id="contact-close" aria-label="Schließen">&times;</button>
      <h3>Kontakt aufnehmen</h3>
      <p class="contact-email-line">E-Mail: <a href="mailto:welove80sde@gmail.com">welove80sde@gmail.com</a></p>
      <div class="contact-success" id="contact-success" style="display:none;">Danke für deine Nachricht! Wir melden uns so schnell wie möglich bei dir.</div>
      <form class="contact-form" method="POST" action="https://formsubmit.co/welove80sde@gmail.com">
        <input type="hidden" name="_subject" value="Driftware — neue Kontaktanfrage">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" id="contact-next" value="">
        <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off">
        <label><span>Name</span><input type="text" name="name" required></label>
        <label><span>Deine E-Mail-Adresse</span><input type="email" name="email" required></label>
        <label><span>Nachricht</span><textarea name="message" required></textarea></label>
        <button type="submit">Senden</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById('contact-modal');
      var link = document.getElementById('contact-link');
      var closeBtn = document.getElementById('contact-close');
      var nextField = document.getElementById('contact-next');
      nextField.value = window.location.origin + window.location.pathname + '?contact=success';

      function open() { overlay.classList.add('open'); }
      function close() { overlay.classList.remove('open'); }

      link.addEventListener('click', function (e) { e.preventDefault(); open(); });
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });

      if (/[?&]contact=success/.test(window.location.search)) {
        document.getElementById('contact-success').style.display = 'block';
        open();
      }
    })();
  </script>
</body>
</html>
