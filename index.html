<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driftware — Apps</title>
<meta name="description" content="Driftware: kleine, unabhängige Apps ohne Schnickschnack. Foto- & Video-Editor Snoxi und weitere Projekte.">
<style>
  :root {
    --bg: #0c1224;
    --panel: #141c33;
    --accent: #3aa8ff;
    --text: #f5f7fa;
    --muted: #9aa3c0;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 88px 24px 24px;
    text-align: center;
  }
  .logo {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
    margin: 0 0 12px;
  }
  .tagline {
    color: var(--muted);
    font-size: 17px;
    margin: 0;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 64px;
  }
  .apps {
    display: grid;
    gap: 16px;
  }
  .app-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  .app-card:hover { border-color: var(--accent); }
  .app-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex-shrink: 0;
    box-shadow: 0 6px 18px rgba(0,0,0,0.35);
  }
  .app-info h2 {
    margin: 0 0 4px;
    font-size: 19px;
  }
  .app-info p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  .app-arrow {
    margin-left: auto;
    color: var(--muted);
    font-size: 20px;
    flex-shrink: 0;
  }
  .app-card.soon {
    opacity: 0.5;
    pointer-events: none;
  }
  .app-placeholder-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <header>
    <p class="logo">Driftware</p>
    <p class="tagline">Kleine, unabhängige Apps ohne Schnickschnack.</p>
  </header>
  <main>
    <div class="apps">
      <a class="app-card" href="/snoxi/">
        <img class="app-icon" src="/snoxi/icon.png" alt="Snoxi Icon">
        <div class="app-info">
          <h2>Snoxi</h2>
          <p>Foto- & Video-Editor — Filter, Sticker, Wasserzeichen, Gesichter unkenntlich machen.</p>
        </div>
        <span class="app-arrow">→</span>
      </a>
      <div class="app-card soon">
        <div class="app-placeholder-icon">✨</div>
        <div class="app-info">
          <h2>Weitere Apps folgen</h2>
          <p>Hier erscheinen zukünftige Projekte.</p>
        </div>
      </div>
    </div>
  </main>
  <footer>
    &copy; 2026 Driftware
    <div><a href="mailto:manca.massimo@gmail.com">Kontakt</a></div>
  </footer>
</body>
</html>
