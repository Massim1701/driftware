name: MusicBrainz-Singles holen

on:
  workflow_dispatch:
    inputs:
      dekade:
        description: 'Dekade (Singles mit Erstveroeffentlichung in diesen Jahren)'
        required: true
        type: choice
        options:
          - '80'
          - '70'
          - '90'
      jahr:
        description: 'Optional: nur dieses eine Jahr (z.B. 1980 zum Testen), sonst alle 10 Jahre der Dekade'
        required: false
        type: string
        default: ''

# Nie zwei Abrufe gleichzeitig: MusicBrainz erlaubt 1 Anfrage/s, und beide
# Laeufe wuerden dieselben data/musicbrainz/-Dateien committen.
concurrency:
  group: fetch-musicbrainz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jahre: ${{ steps.jahre.outputs.jahre }}
    steps:
      - id: jahre
        env:
          DEKADE: ${{ inputs.dekade }}
          JAHR: ${{ inputs.jahr }}
        run: |
          if [ -n "$JAHR" ]; then
            if ! [[ "$JAHR" =~ ^19[0-9]{2}$ ]] || [ "${JAHR:2:1}" != "${DEKADE:0:1}" ]; then
              echo "::error::Jahr $JAHR passt nicht zur Dekade ${DEKADE}er."
              exit 1
            fi
            echo "jahre=[$JAHR]" >> "$GITHUB_OUTPUT"
          else
            S=$((1900 + DEKADE))
            echo "jahre=[$(seq -s, $S $((S + 9)))]" >> "$GITHUB_OUTPUT"
          fi

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    # Ein Jahr dauert ca. 10-20 min; 2h Sicherheitsgrenze pro Jahr-Job,
    # das Skript selbst hoert nach 110 min sauber auf und speichert.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # nacheinander: MusicBrainz-Limit gilt pro Anwendung, nicht pro Runner
      max-parallel: 1
      matrix:
        jahr: ${{ fromJSON(needs.plan.outputs.jahre) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Singles ${{ matrix.jahr }} holen
        env:
          MB_TIME_BUDGET_SECONDS: '6600'
        run: python3 tools/fetch_musicbrainz.py ${{ matrix.jahr }}

      - name: Ergebnis als Artifact sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicbrainz-${{ matrix.jahr }}
          # Fortschrittsdatei nur, wenn das Jahr unvollstaendig blieb
          path: |
            data/musicbrainz/${{ matrix.jahr }}.csv
            data/musicbrainz/fortschritt/${{ matrix.jahr }}.json
          if-no-files-found: ignore
          retention-days: 30

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: musicbrainz-*
          path: ${{ runner.temp }}/mb

      - name: Dateien uebernehmen
        run: |
          mkdir -p data/musicbrainz/fortschritt
          shopt -s nullglob
          for d in "$RUNNER_TEMP"/mb/musicbrainz-*; do
            y="${d##*-}"
            # upload-artifact kuerzt auf den gemeinsamen Ordner: CSV liegt
            # direkt drin, Fortschritt unter fortschritt/ (oder direkt, wenn
            # nur die Fortschrittsdatei hochgeladen wurde)
            if [ -f "$d/$y.csv" ] && [ ! -f "$d/fortschritt/$y.json" ]; then
              cp "$d/$y.csv" "data/musicbrainz/$y.csv"
              rm -f "data/musicbrainz/fortschritt/$y.json"
              echo "$y: vollstaendig"
            else
              f="$d/fortschritt/$y.json"; [ -f "$f" ] || f="$d/$y.json"
              [ -f "$f" ] && cp "$f" "data/musicbrainz/fortschritt/$y.json" && echo "$y: unvollstaendig, Fortschritt gesichert"
            fi
          done

      - name: Committen und pushen
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/musicbrainz
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "MusicBrainz-Singles ${{ inputs.jahr || format('{0}er', inputs.dekade) }} geholt"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $i), hole Remote-Stand..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort; echo "::error::Rebase-Konflikt in data/musicbrainz -- CSVs liegen im Artifact."; exit 1; }
          done
          echo "::error::Push nach mehreren Versuchen fehlgeschlagen -- CSVs liegen im Artifact."
          exit 1
