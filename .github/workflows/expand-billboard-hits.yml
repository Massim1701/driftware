name: Billboard-Hits nachziehen

on:
  workflow_dispatch:
    inputs:
      decade:
        description: 'Welche Dekade (auto = automatisch die mit der groessten verbleibenden Luecke)'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - 70er
          - 80er
          - 90er
          - 2000er
          - 2010er
          - 2020er
  schedule:
    # Taeglich um 03:47 UTC -- zeitlich versetzt zu process-missing-songs
    # (04:17), expand-christmas-songs (04:37) und bpm-fetch (05:52), siehe
    # Kommentar dort/in expand-decade-genres.yml zur eigenen Concurrency-
    # Gruppe je Workflow.
    - cron: '47 3 * * *'

# Eigene Gruppe, gleicher Grund wie bei den anderen drei taeglichen
# Workflows (siehe expand-decade-genres.yml fuer die ausfuehrliche
# Begruendung): eine geteilte Gruppe liesse GitHub aeltere, noch wartende
# Laeufe canceln, sobald ein neuerer Lauf in dieselbe Warteschlange kommt.
concurrency:
  group: expand-billboard-hits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten installieren
        run: pip install --quiet yt-dlp

      - name: Dekade bestimmen
        id: pick
        env:
          INPUT_DECADE: ${{ inputs.decade }}
        run: |
          if [ -n "$INPUT_DECADE" ] && [ "$INPUT_DECADE" != "auto" ]; then
            echo "decade=$INPUT_DECADE" >> "$GITHUB_OUTPUT"
          else
            python3 tools/pick_billboard_decade.py >> "$GITHUB_OUTPUT"
          fi

      - name: Billboard-Kandidaten sammeln (Phase A)
        # Eigenes, kleineres Zeitbudget als die YouTube-Aufloesung unten --
        # das Discogs-Nachschlagen ist der langsamere Teil (unauthentifiziert
        # rate-limited), soll aber nicht den ganzen 6h-Job fuer sich
        # beanspruchen. Siehe tools/fetch_billboard_hits.py fuer den
        # Hintergrund (Nutzerfrage "haben wir alles von discogs gezogen?").
        env:
          BILLBOARD_TIME_BUDGET_SECONDS: '3600'
          # Nutzerfund 26.9.: der Discogs-Token liegt schon als Repo-Secret
          # vor (fuer process-missing-songs.yml eingerichtet), wurde hier
          # aber nie durchgereicht -- ohne ihn lief dieser Workflow bisher
          # unnoetig unauthentifiziert/gedrosselt.
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python3 tools/fetch_billboard_hits.py "${{ steps.pick.outputs.decade }}"

      - name: YouTube-Links aufloesen (Phase B)
        # Dieselbe Warteliste/Verarbeitung wie bei der Dekaden-Genre-
        # Erweiterung (siehe process_decade_queue.py) -- Billboard-
        # Kandidaten landen genre_key="Ohne" und lassen sich spaeter ueber
        # den bestehenden "Genre bearbeiten"-Button im Song-Modal manuell
        # zuordnen.
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
          DECADE_TIME_BUDGET_SECONDS: '15000'
        run: python3 tools/process_decade_queue.py

      - name: Aenderungen committen und pushen
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "queue/${DECADE_QUEUE_KEY}-erweiterung.json" "${DECADE_QUEUE_KEY}-music/songs.json"
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "${DECADE_QUEUE_KEY}: Billboard-Hits nachgezogen"

          # Gleiche Redo-Strategie wie die anderen taeglichen Workflows
          # (siehe expand-decade-genres.yml fuer die ausfuehrliche
          # Begruendung): bei einem echten Rebase-Konflikt nicht von Hand
          # zusammenfuehren, sondern auf den frischen Remote-Stand
          # zuruecksetzen und dort neu anstossen -- beide Skripte sind
          # dafuer bewusst zustandslos/wiederholbar.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi

            echo "Push abgelehnt (Versuch $i), hole Remote-Stand..."
            git fetch origin master

            if git rebase origin/master; then
              echo "Sauber rebased, versuche erneut zu pushen."
              continue
            fi

            echo "Echter Rebase-Konflikt -- Rebase abgebrochen, Lauf wird auf dem neuen Remote-Stand neu aufgesetzt statt blind zusammengefuehrt."
            git rebase --abort
            git reset --hard origin/master

            ELAPSED=$(( $(date +%s) - JOB_START_TS ))
            BUDGET=$(( 20700 - ELAPSED ))
            if [ "$BUDGET" -lt 120 ]; then
              echo "Kaum noch Zeit im 6h-Job-Limit uebrig -- Neu-Verarbeitung wird uebersprungen, der naechste Lauf uebernimmt den Rest. Kein Datenverlust, da bereits auf den frischen Remote-Stand zurueckgesetzt."
              exit 0
            fi

            DECADE_TIME_BUDGET_SECONDS=$BUDGET python3 tools/process_decade_queue.py

            git add "queue/${DECADE_QUEUE_KEY}-erweiterung.json" "${DECADE_QUEUE_KEY}-music/songs.json"
            if git diff --cached --quiet; then
              echo "Nach Neu-Verarbeitung auf dem frischen Stand keine eigenen Aenderungen mehr uebrig."
              exit 0
            fi
            git commit -m "${DECADE_QUEUE_KEY}: Billboard-Hits nachgezogen"
          done

          echo "::error::Push nach mehreren Versuchen fehlgeschlagen, Fortschritt bleibt lokal im Runner (geht verloren)."
          exit 1
