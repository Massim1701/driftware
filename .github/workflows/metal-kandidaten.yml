name: Metall-Kandidaten sammeln

# Phase A der Metall-Erweiterung: Discogs abfragen, queue/<dekade>-metal.json schreiben
# und committen. Die YouTube-Links loest tools/process_metal_local.py auf dem Mac auf
# (yt-dlp wird auf den Runnern von YouTube blockiert).
on:
  workflow_dispatch:
    inputs:
      dekade:
        description: 'Dekade (alle = alle sechs)'
        required: true
        type: choice
        default: alle
        options: [alle, 70er, 80er, 90er, 2000er, 2010er, 2020er]

concurrency:
  group: metal-kandidaten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kandidaten holen
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [ "${{ inputs.dekade }}" = "alle" ]; then python3 tools/fetch_metal_candidates.py
          else python3 tools/fetch_metal_candidates.py "${{ inputs.dekade }}"; fi
      - name: Committen und pushen
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/*-metal.json
          git diff --cached --quiet && { echo "Keine Aenderungen."; exit 0; }
          git commit -m "Metall-Kandidaten gesammelt (${{ inputs.dekade }})"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
