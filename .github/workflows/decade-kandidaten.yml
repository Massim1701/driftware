name: Dekaden-Kandidaten sammeln (Discogs)

# Phase A der Genre-Erweiterung einer Dekade: Discogs abfragen (mit DISCOGS_TOKEN
# aus den Repo-Secrets), gegen den Katalog der Dekade deduplizieren und nach
# queue/<dekade>-erweiterung.json schreiben. Die YouTube-Links loest danach
# expand-decade-genres.yml auf (Phase B).
#
# probelauf = true (Standard): nichts wird committet. Der Lauf zeigt nur Zahlen und
# eine Stichprobe in der Zusammenfassung und haengt die neuen Kandidaten als
# Artefakt an.
on:
  workflow_dispatch:
    inputs:
      dekade:
        description: 'Dekade'
        required: true
        type: choice
        default: 2010er
        options: [70er, 80er, 90er, 2000er, 2010er, 2020er]
      genre:
        description: 'Genre-Schluessel im Katalog (Kategorie in songs.json, z. B. Techno). Gibt es ihn noch nicht, entsteht beim Eintragen eine neue Kategorie.'
        required: true
        type: string
      stile:
        description: 'Discogs-Stile, kommagetrennt (z. B. Techno,Tech House)'
        required: true
        type: string
      min_have:
        description: 'Mindestzahl Discogs-Sammler (hv) je Release'
        required: true
        type: string
        default: '20'
      probelauf:
        description: 'Probelauf: nichts committen, nur Zahlen und Stichprobe zeigen'
        required: true
        type: boolean
        default: true

concurrency:
  group: decade-kandidaten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Eingaben pruefen
        env:
          GENRE: ${{ inputs.genre }}
          STILE: ${{ inputs.stile }}
          MIN_HAVE: ${{ inputs.min_have }}
        run: |
          # Eingaben nur ueber Umgebungsvariablen verwenden, nie direkt in run: einsetzen
          python3 - <<'PY'
          import os, re, sys
          ok = True
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,40}", os.environ["GENRE"]):
              print("Genre-Schluessel: nur Buchstaben, Ziffern, _ und -, max. 40 Zeichen"); ok = False
          if not re.fullmatch(r"[A-Za-z0-9 &/.'-]+(,[A-Za-z0-9 &/.'-]+)*", os.environ["STILE"]):
              print("Stile: kommagetrennte Discogs-Stilnamen (Buchstaben, Ziffern, Leerzeichen)"); ok = False
          if not re.fullmatch(r"[0-9]{1,5}", os.environ["MIN_HAVE"]):
              print("min_have: ganze Zahl"); ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Stand vorher merken
        env:
          DEKADE: ${{ inputs.dekade }}
        run: |
          mkdir -p "$RUNNER_TEMP/vorher"
          cp "queue/${DEKADE}-erweiterung.json" "$RUNNER_TEMP/vorher/queue.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/vorher/queue.json"

      - name: Kandidaten holen
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          PYTHONUNBUFFERED: '1'
          MIN_HAVE: ${{ inputs.min_have }}
          DEKADE: ${{ inputs.dekade }}
          GENRE: ${{ inputs.genre }}
          STILE: ${{ inputs.stile }}
        run: python3 tools/fetch_decade_genre_candidates.py "$DEKADE" "${GENRE}=${STILE}"

      - name: Zusammenfassung
        env:
          DEKADE: ${{ inputs.dekade }}
          GENRE: ${{ inputs.genre }}
          VORHER: ${{ runner.temp }}/vorher/queue.json
        run: |
          python3 - <<'PY'
          import json, os, statistics
          dek, genre = os.environ["DEKADE"], os.environ["GENRE"]
          alt = {c["id"] for c in json.load(open(os.environ["VORHER"], encoding="utf-8"))}
          neu = [c for c in json.load(open(f"queue/{dek}-erweiterung.json", encoding="utf-8"))
                 if c["id"] not in alt and c.get("genre_key") == genre]
          json.dump(neu, open(os.path.join(os.environ["RUNNER_TEMP"], "neue-kandidaten.json"), "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          neu.sort(key=lambda c: -(c.get("hv") or 0))
          hv = [c.get("hv") or 0 for c in neu]
          z = [f"## Kandidaten {dek} / {genre}", "", f"- Neue Kandidaten: **{len(neu)}**"]
          if hv:
              z += [f"- Sammler (hv): Median {int(statistics.median(hv))}, Maximum {max(hv)}, Minimum {min(hv)}"]
              for grenze in (20, 50, 100, 250, 500):
                  z.append(f"- mit hv >= {grenze}: {sum(1 for h in hv if h >= grenze)}")
              z += ["", "Stichprobe (die 30 beliebtesten):", "", "| hv | Jahr | Interpret | Titel | Stile |", "|---:|---:|---|---|---|"]
              for c in neu[:30]:
                  z.append(f"| {c.get('hv')} | {c.get('y')} | {c.get('a')} | {c.get('t')} | {c.get('s')} |".replace("\n", " "))
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(z) + "\n")
          print("\n".join(z[:8]))
          PY

      - name: Neue Kandidaten als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: neue-kandidaten-${{ inputs.dekade }}-${{ inputs.genre }}
          path: ${{ runner.temp }}/neue-kandidaten.json
          if-no-files-found: ignore

      - name: Committen und pushen
        if: ${{ !inputs.probelauf }}
        env:
          DEKADE: ${{ inputs.dekade }}
          GENRE: ${{ inputs.genre }}
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "queue/${DEKADE}-erweiterung.json"
          git diff --cached --quiet && { echo "Keine Aenderungen."; exit 0; }
          git commit -m "Kandidaten gesammelt: ${DEKADE} / ${GENRE}"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
