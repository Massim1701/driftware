name: Ohne-Songs per Discogs einsortieren

# Ablauf (siehe tools/reclassify_ohne_discogs.py):
#   apply=false  -> nur Bericht: Discogs abfragen, CSV als Artifact, nichts geaendert
#   apply=true   -> zusaetzlich Songs in <dekade>-music/songs.json verschieben,
#                   committen und pushen
# Nur Songs aus der Kategorie 'Ohne' werden angefasst, und nur verschoben.

on:
  workflow_dispatch:
    inputs:
      dekade:
        description: 'Dekade'
        required: true
        type: choice
        default: alle
        options:
          - alle
          - 70er
          - 80er
          - 90er
          - 2000er
          - 2010er
          - 2020er
      apply:
        description: 'apply=true: Songs wirklich verschieben und committen'
        required: true
        type: boolean
        default: false

# gleiche Gruppe wie expand-decade-genres.yml, damit nie beide gleichzeitig
# in die songs.json schreiben.
concurrency:
  group: expand-decade-genres
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write

jobs:
  einsortieren:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bei Discogs suchen
        timeout-minutes: 335
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python3 tools/reclassify_ohne_discogs.py suchen --dekade "${{ inputs.dekade }}" \
            --cache "$RUNNER_TEMP/ohne-cache.json" --bericht "$RUNNER_TEMP/ohne-bericht.csv"

      - name: Bericht und Zwischenstand als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohne-bericht
          path: |
            ${{ runner.temp }}/ohne-bericht.csv
            ${{ runner.temp }}/ohne-cache.json
          retention-days: 30

      - name: Songs verschieben
        if: inputs.apply
        run: python3 tools/reclassify_ohne_discogs.py anwenden --dekade "${{ inputs.dekade }}" --cache "$RUNNER_TEMP/ohne-cache.json"

      - name: Committen und pushen
        if: inputs.apply
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ./*-music/songs.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "Ohne-Songs per Discogs-Zweitlauf einsortiert (${{ inputs.dekade }})"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $i), setze auf frischem Stand neu auf..."
            git fetch origin "$GITHUB_REF_NAME"
            # Verschieben ist aus dem Cache wiederholbar, ohne neue Discogs-Abfrage.
            git reset --hard "origin/$GITHUB_REF_NAME"
            python3 tools/reclassify_ohne_discogs.py anwenden --dekade "${{ inputs.dekade }}" --cache "$RUNNER_TEMP/ohne-cache.json"
            git add ./*-music/songs.json
            git diff --cached --quiet && { echo "Nichts mehr zu tun."; exit 0; }
            git commit -m "Ohne-Songs per Discogs-Zweitlauf einsortiert (${{ inputs.dekade }})"
          done
          echo "::error::Push nach mehreren Versuchen fehlgeschlagen."
          exit 1
