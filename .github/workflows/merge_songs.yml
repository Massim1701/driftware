name: MusicBrainz-Songs abgleichen

# Ablauf (siehe tools/merge_into_json.py):
#   apply=false            -> immer NUR Bericht (Dry-Run), egal welcher Schritt
#   schritt=anreichern     -> neue Songs bei Discogs nachschlagen, Ergebnis nach
#     + apply=true            data/musicbrainz/angereichert-<dekade>.json
#   schritt=eintragen      -> an queue/<dekade>-erweiterung.json anhaengen (YouTube-
#     + apply=true            Suche danach per expand-decade-genres.yml), Rest nach
#     + min_have              queue/<dekade>-musicbrainz-selten.json
# Bestehende Eintraege werden nie geaendert, nur angehaengt.

on:
  workflow_dispatch:
    inputs:
      dekade:
        description: 'Dekade'
        required: true
        type: choice
        options:
          - '80'
          - '70'
          - '90'
          - '2000'
          - '2010'
          - '2020'
      schritt:
        description: 'Schritt (ohne apply=true laeuft nur der Bericht)'
        required: true
        type: choice
        default: bericht
        options:
          - bericht
          - anreichern
          - eintragen
      apply:
        description: 'apply=true: Schritt wirklich ausfuehren und committen'
        required: true
        type: boolean
        default: false
      min_have:
        description: 'Nur fuer eintragen: Mindest-Sammlerzahl (Discogs "have")'
        required: false
        type: string
        default: ''
      tag:
        description: 'Tag-Modus (z. B. techno): Dateien aus data/musicbrainz-tags/<tag>/ statt data/musicbrainz/. Leer = wie bisher.'
        required: false
        type: string
        default: ''
      kette:
        description: 'Nur anreichern: nach dem Lauf sich selbst neu starten, solange noch Songs offen sind'
        required: false
        type: boolean
        default: false

# anreichern (apply) laeuft IMMER nur einzeln, ueber alle Dekaden und Tags: sonst fragen zwei
# Laeufe gleichzeitig bei Discogs ab (Rate-Limit/Sperre).
# eintragen teilt sich die Gruppe mit expand-decade-genres.yml, damit nie
# beide gleichzeitig queue/<dekade>-erweiterung.json schreiben.
concurrency:
  group: ${{ (inputs.apply && inputs.schritt == 'eintragen') && 'expand-decade-genres' || ((inputs.apply && inputs.schritt == 'anreichern') && 'discogs-anreichern' || format('merge-songs-{0}{1}', inputs.dekade, inputs.tag && format('-{0}', inputs.tag) || '')) }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

permissions:
  contents: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Branch-Spitze statt Ausloese-Commit: ein in der Concurrency-Gruppe wartender Lauf
      # wuerde sonst auf dem veralteten Stand starten und beim Push am Konflikt scheitern.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Eingaben pruefen
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[a-z0-9-]{1,30}$ ]]; then
            echo "::error::tag: nur Kleinbuchstaben, Ziffern und - (max. 30 Zeichen)"
            exit 1
          fi

      - name: Bericht (Dry-Run)
        timeout-minutes: 15
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TAG_ARGS=(); [ -n "$TAG" ] && TAG_ARGS=(--tag "$TAG")
          python3 tools/merge_into_json.py --dekade "${{ inputs.dekade }}" "${TAG_ARGS[@]}" --dry-run --bericht "$RUNNER_TEMP/bericht-${{ inputs.dekade }}er.csv"

      - name: Bericht als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bericht-${{ inputs.dekade }}er${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
          path: ${{ runner.temp }}/bericht-${{ inputs.dekade }}er.csv
          retention-days: 30

      - name: Bei Discogs anreichern
        if: inputs.apply && inputs.schritt == 'anreichern'
        timeout-minutes: 335
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          MERGE_TIME_BUDGET_SECONDS: '19200'
          TAG: ${{ inputs.tag }}
        run: |
          TAG_ARGS=(); [ -n "$TAG" ] && TAG_ARGS=(--tag "$TAG")
          python3 tools/merge_into_json.py --dekade "${{ inputs.dekade }}" "${TAG_ARGS[@]}" --anreichern | tee "$RUNNER_TEMP/anreichern.log"
          # Rest fuer den Ketten-Schritt merken (pipefail ist an: Fehler bricht ab)
          grep -o 'Fertig fuer diesen Lauf: [0-9]* nachgeschlagen, [0-9]* noch offen' "$RUNNER_TEMP/anreichern.log" | tail -1 \
            | sed -E 's/.*: ([0-9]+) nachgeschlagen, ([0-9]+) noch offen/LOOKED_UP=\1\nREST=\2/' >> "$GITHUB_ENV" || true

      - name: In die Warteliste eintragen
        if: inputs.apply && inputs.schritt == 'eintragen'
        timeout-minutes: 15
        env:
          MIN_HAVE: ${{ inputs.min_have }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$MIN_HAVE" =~ ^[0-9]+$ ]]; then
            echo "::error::Fuer eintragen bitte min_have als Zahl angeben."
            exit 1
          fi
          TAG_ARGS=(); [ -n "$TAG" ] && TAG_ARGS=(--tag "$TAG")
          python3 tools/merge_into_json.py --dekade "${{ inputs.dekade }}" "${TAG_ARGS[@]}" --eintragen --min-have "$MIN_HAVE"

      - name: Backup als Artifact
        if: inputs.apply && inputs.schritt == 'eintragen'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ inputs.dekade }}er${{ inputs.tag && format('-{0}', inputs.tag) || '' }}
          path: |
            data/musicbrainz/backup/
            data/musicbrainz-tags/*/backup/
          if-no-files-found: ignore
          retention-days: 90

      - name: Committen und pushen
        if: inputs.apply && inputs.schritt != 'bericht'
        env:
          DEK: ${{ inputs.dekade }}er
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$TAG" ]; then SRC="data/musicbrainz-tags/${TAG}"; SELTEN="queue/${DEK}-musicbrainz-${TAG}-selten.json"; LABEL="MusicBrainz ${DEK} (${TAG})"
          else SRC="data/musicbrainz"; SELTEN="queue/${DEK}-musicbrainz-selten.json"; LABEL="MusicBrainz ${DEK}"; fi
          if [ "${{ inputs.schritt }}" = "anreichern" ]; then
            FILES="${SRC}/angereichert-${DEK}.json"
            MSG="${LABEL}: Discogs-Anreicherung"
          else
            FILES="queue/${DEK}-erweiterung.json ${SELTEN}"
            MSG="${LABEL}: neue Songs in die Warteliste (min. ${{ inputs.min_have }} Sammler)"
          fi
          for f in $FILES; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "$MSG"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $i), hole Remote-Stand..."
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase --autostash "origin/$GITHUB_REF_NAME"; then
              continue
            fi
            # Echter Konflikt: wie in expand-decade-genres.yml nicht von Hand
            # zusammenfuehren, sondern auf frischem Stand neu ausfuehren --
            # merge_into_json.py ist wiederholbar (bereits Eingetragenes zaehlt
            # beim erneuten Abgleich als "vorhanden").
            git rebase --abort || true
            git reset --hard "origin/$GITHUB_REF_NAME"
            ELAPSED=$(( $(date +%s) - JOB_START_TS ))
            if [ "${{ inputs.schritt }}" = "anreichern" ]; then
              echo "::warning::Konflikt bei der Anreicherung -- Lauf bitte erneut starten (Fortschritt dieses Laufs verworfen)."
              exit 1
            fi
            [ "$ELAPSED" -gt 19800 ] && { echo "::error::Zeit knapp, bitte erneut starten."; exit 1; }
            python3 tools/merge_into_json.py --dekade "${{ inputs.dekade }}" --eintragen --min-have "${{ inputs.min_have }}"
            for f in $FILES; do [ -f "$f" ] && git add "$f"; done
            git diff --cached --quiet && { echo "Nichts mehr zu tun."; exit 0; }
            git commit -m "$MSG"
          done
          echo "::error::Push nach mehreren Versuchen fehlgeschlagen."
          exit 1

      # Kette: Lauf beendet, es sind noch Songs offen und dieser Lauf hat Fortschritt
      # gemacht -> naechsten Lauf starten. Stoppt von selbst bei 0 offen oder 0 Treffern.
      - name: Naechsten Lauf starten
        if: success() && inputs.apply && inputs.schritt == 'anreichern' && inputs.kette
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "nachgeschlagen: ${LOOKED_UP:-?}, offen: ${REST:-?}"
          if [ "${REST:-0}" -gt 0 ] && [ "${LOOKED_UP:-0}" -gt 0 ]; then
            gh workflow run merge_songs.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f dekade="${{ inputs.dekade }}" -f schritt=anreichern -f apply=true -f kette=true -f tag="$TAG"
            echo "Naechster Lauf gestartet."
          else
            echo "Kette beendet."
          fi
