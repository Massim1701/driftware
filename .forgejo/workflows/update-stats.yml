name: Song-Statistik aktualisieren

# Zaehlt alle Songs (tools/count_songs.py) und schreibt dekaden/stats.json,
# die auf /dekaden/ als Song-Zahl angezeigt wird. Den taeglichen Lauf macht der
# Nachtlauf (nachts.yml, Schritt 'statistik'); hier nur noch nach einem Push, der
# songs.json aendert, und manuell.

on:
  push:
    branches: [master]
    paths:
      - '*-music/songs.json'
  workflow_dispatch: {}

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fuer die Aenderungsdaten in sitemap.xml (git log)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zaehlen und Sitemap erzeugen
        run: |
          python3 tools/count_songs.py
          python3 tools/build_sitemap.py

      - name: Aenderung committen und pushen
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dekaden/stats.json sitemap.xml
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
            exit 0
          fi
          git commit -m "Song-Statistik aktualisiert"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin master
            git rebase --autostash origin/master || { git rebase --abort || true; git reset --hard origin/master; python3 tools/count_songs.py; python3 tools/build_sitemap.py; git add dekaden/stats.json sitemap.xml; git commit -q -m "Song-Statistik aktualisiert"; }
          done
          exit 1

  # Ersatz fuer workflow_run (Forgejo kennt es nicht): am Ende melden wir dem Caretaker,
  # ob der Lauf geklappt hat. Er schliesst Tickets bzw. startet bei Fehlern neu.
  meldung:
    needs: [stats]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Caretaker rufen
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          RESULTS: ${{ needs.stats.result }}
        run: |
          RES=success
          for r in $RESULTS; do case "$r" in failure|cancelled) RES=failure;; esac; done
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"workflow\":\"update-stats.yml\",\"result\":\"$RES\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/caretaker.yml/dispatches" \
            && echo "Caretaker gerufen: update-stats.yml -> $RES" || echo "Caretaker konnte nicht gerufen werden (Rechte?)"
