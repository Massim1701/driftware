name: Tote Videos pruefen

# Prueft taeglich einen Teil der YouTube-IDs (tools/check_dead_videos.py, oEmbed)
# und schreibt die toten/nicht einbettbaren IDs nach queue/dead-videos.json.
# Es wird NICHTS automatisch entfernt -- die Liste dient der gezielten Neu-Suche.
# ERSTER SCHRITT DER TAGESKETTE (einziger Zeitplan): check-dead-videos -> nachts -> karaoke-songs
# -> backup-fornetta -> waechter. Jeder Schritt startet am Ende den naechsten (Runner schafft nur einen Job).
# Der Pruefstand liegt im Actions-Cache (nicht im Repo), damit das Repo nicht waechst.

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      kette:
        description: 'Von der Tageskette gesetzt: danach den naechsten Schritt starten (von Hand leer lassen)'
        required: false
        type: string
        default: ''

concurrency:
  group: check-dead-videos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruefstand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: queue/dead-videos-state.json
          key: dead-videos-state-${{ github.run_id }}
          restore-keys: dead-videos-state-

      - name: Pruefen (ca. 60 Minuten)
        run: python3 tools/check_dead_videos.py 3600 12

      - name: Pruefstand speichern
        uses: actions/cache/save@v4
        with:
          path: queue/dead-videos-state.json
          key: dead-videos-state-${{ github.run_id }}

      - name: Ergebnis committen und pushen
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/dead-videos.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung."
            exit 0
          fi
          git commit -m "Tote Videos aktualisiert"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin master
            git rebase --autostash origin/master || { git rebase --abort || true; git reset --hard origin/master; exit 1; }
          done
          exit 1

      - name: Tote Videos ersetzen (neue Suche, geprueft)
        # eigener, begrenzter Schritt: darf die Tageskette nie aufhalten oder scheitern lassen
        continue-on-error: true
        timeout-minutes: 25
        env:
          ERSATZ_TIME_BUDGET_SECONDS: '1200'
        run: |
          pip install --quiet yt-dlp
          export JOB_START_TS=$(date +%s) JOB_LIMIT_SECONDS=1560   # nach einem Push-Konflikt bleibt hoechstens der Rest dieser Schrittzeit
          python3 tools/ersetze_tote_videos.py
          bash tools/push_retry.sh "Tote Videos ersetzt" \
            "ERSATZ_TIME_BUDGET_SECONDS=\$REDO_BUDGET_SECONDS python3 tools/ersetze_tote_videos.py" \
            queue/dead-videos-ersatz.json \
            70er-music/songs.json 80er-music/songs.json 90er-music/songs.json \
            2000er-music/songs.json 2010er-music/songs.json 2020er-music/songs.json \
            afterwork-music/songs.json chillhouse-music/songs.json christmas-music/songs.json \
            cozy-music/songs.json dinnerparty-music/songs.json focuswork-music/songs.json \
            gaming-music/songs.json grill-music/songs.json haushalt-music/songs.json \
            karaoke-music/songs.json latenight-music/songs.json metal-music/songs.json \
            morning-music/songs.json nostalgie-music/songs.json partyhits-music/songs.json \
            roadtrip-music/songs.json romantic-music/songs.json summer-music/songs.json \
            workout-music/songs.json yoga-music/songs.json

  # Ersatz fuer workflow_run (Forgejo kennt es nicht): am Ende melden wir dem Caretaker,
  # ob der Lauf geklappt hat. Er schliesst Tickets bzw. startet bei Fehlern neu.
  meldung:
    needs: [check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Caretaker rufen
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          KETTE: ${{ (github.event_name == 'schedule' || inputs.kette == 'true') && 'true' || '' }}
          RESULTS: ${{ needs.check.result }}
        run: |
          RES=success
          for r in $RESULTS; do case "$r" in failure|cancelled) RES=failure;; esac; done
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"workflow\":\"check-dead-videos.yml\",\"result\":\"$RES\",\"kette\":\"$KETTE\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/caretaker.yml/dispatches" \
            && echo "Caretaker gerufen: check-dead-videos.yml -> $RES" || echo "Caretaker konnte nicht gerufen werden (Rechte?)"

      - name: Tageskette - naechster Schritt (nachts.yml)
        if: ${{ always() && (github.event_name == 'schedule' || inputs.kette == 'true') }}
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"kette\":\"true\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/nachts.yml/dispatches" \
            && echo "Tageskette: nachts.yml gestartet" || { echo "::error::Tageskette: nachts.yml konnte nicht gestartet werden"; exit 1; }
