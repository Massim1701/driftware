name: Wächter (Aktualitaet pruefen)

# Faengt auch stille Ausfaelle ab (Lauf gar nicht gestartet, abgebrochen,
# Workflow deaktiviert): alle 3 Stunden wird geprueft, ob jeder
# ueberwachte Workflow in seinem Zeitfenster erfolgreich war. Wenn nicht,
# startet der Caretaker ihn neu bzw. oeffnet ein Ticket. Logik: tools/wachter.py
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

concurrency:
  group: caretaker
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  waechter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
          persist-credentials: false

      - name: Alle ueberwachten Workflows pruefen
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: tools/wachter.sh sweep
