name: Nachtlauf (Daten-Kette)

# Taeglich 03:17 UTC (und manuell startbar). Ersetzt seit 19.10.2026 diese einzeln laufenden Workflows durch EINE Kette, in der immer
# nur ein Job gleichzeitig in die *-music/songs.json schreibt:
#   Fehlende Songs -> YouTube-Aufrufzahlen -> Billboard -> UK-Charts
#   -> BPM -> Statistik
# Jeder Job holt vor dem Start den aktuellen Stand von master und pusht ueber
# tools/push_retry.sh (behebt den Exit-128-Fehler der alten Inline-Pushes). Faellt
# ein Job aus, laufen die folgenden trotzdem weiter.
# Umstellen: siehe docs/nachtlauf-umstellung.md.

on:
  workflow_dispatch:
    inputs:
      nur:
        description: 'Nur diesen Schritt ausfuehren (zum Testen)'
        required: false
        type: choice
        default: alle
        options:
          - alle
          - fehlende
          - aufrufzahlen
          - billboard
          - uk
          - bpm
          - statistik
      kette:
        description: 'Von der Tageskette gesetzt: danach karaoke-songs starten (von Hand leer lassen)'
        required: false
        type: string
        default: ''
      dekade:
        description: 'Dekade fuer billboard, uk und bpm (auto = automatisch die mit der groessten Luecke)'
        required: false
        type: choice
        default: auto
        options: [auto, 70er, 80er, 90er, 2000er, 2010er, 2020er]
concurrency:
  group: nachtlauf
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  fehlende:
    name: Fehlende Songs verarbeiten
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_LIMIT_SECONDS: '3300'
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'fehlende') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten installieren
        run: |
          pip install --quiet yt-dlp

      - name: Warteliste verarbeiten
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          QUEUE_TIME_BUDGET_SECONDS: '3000'
        run: python3 tools/process_missing_queue.py

      - name: Committen und pushen
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          tools/push_retry.sh "Warteliste automatisch verarbeitet" \
          'QUEUE_TIME_BUDGET_SECONDS=$REDO_BUDGET_SECONDS python3 tools/process_missing_queue.py' \
          queue/ '*-music/songs.json'

  aufrufzahlen:
    name: YouTube-Aufrufzahlen aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_LIMIT_SECONDS: '1200'
    needs: fehlende
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'aufrufzahlen') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: YouTube-Aufrufzahlen abrufen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VIEWCOUNT_TIME_BUDGET_SECONDS: '900'
        run: python3 tools/fetch_youtube_viewcounts.py

      - name: Committen und pushen
        run: |
          tools/push_retry.sh "YouTube-Aufrufzahlen aktualisiert" \
          'VIEWCOUNT_TIME_BUDGET_SECONDS=$REDO_BUDGET_SECONDS python3 tools/fetch_youtube_viewcounts.py' \
          '*-music/songs.json'

  billboard:
    name: Billboard-Hits nachziehen
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JOB_LIMIT_SECONDS: '3000'
    needs: aufrufzahlen
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'billboard') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten installieren
        run: |
          pip install --quiet yt-dlp

      - name: Dekade bestimmen
        id: pick
        env:
          INPUT_DECADE: ${{ inputs.dekade }}
        run: |
          if [ -n "$INPUT_DECADE" ] && [ "$INPUT_DECADE" != "auto" ]; then
            echo "decade=$INPUT_DECADE" >> "$GITHUB_OUTPUT"
          else
            python3 tools/pick_billboard_decade.py >> "$GITHUB_OUTPUT"
          fi

      - name: Billboard-Kandidaten sammeln (Phase A)
        env:
          BILLBOARD_TIME_BUDGET_SECONDS: '900'
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python3 tools/fetch_billboard_hits.py "${{ steps.pick.outputs.decade }}"

      - name: YouTube-Links aufloesen (Phase B)
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
          DECADE_TIME_BUDGET_SECONDS: '1800'
        run: python3 tools/process_decade_queue.py

      - name: Committen und pushen
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
        run: |
          tools/push_retry.sh "${DECADE_QUEUE_KEY}: Billboard-Hits nachgezogen" \
          'DECADE_TIME_BUDGET_SECONDS=$REDO_BUDGET_SECONDS python3 tools/process_decade_queue.py' \
          "queue/${DECADE_QUEUE_KEY}-erweiterung.json" "${DECADE_QUEUE_KEY}-music/songs.json"

  uk:
    name: UK-Charts-Hits nachziehen
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      JOB_LIMIT_SECONDS: '3000'
    needs: billboard
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'uk') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten installieren
        run: |
          pip install --quiet yt-dlp openpyxl

      - name: Dekade bestimmen
        id: pick
        env:
          INPUT_DECADE: ${{ inputs.dekade }}
        run: |
          if [ -n "$INPUT_DECADE" ] && [ "$INPUT_DECADE" != "auto" ]; then
            echo "decade=$INPUT_DECADE" >> "$GITHUB_OUTPUT"
          else
            python3 tools/pick_uk_chart_decade.py >> "$GITHUB_OUTPUT"
          fi

      - name: UK-Chart-Kandidaten sammeln (Phase A)
        env:
          UKCHARTS_TIME_BUDGET_SECONDS: '2400'
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: python3 tools/fetch_uk_chart_hits.py "${{ steps.pick.outputs.decade }}" --min-peak 40

      - name: YouTube-Links aufloesen (Phase B)
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
          DECADE_TIME_BUDGET_SECONDS: '300'
        run: python3 tools/process_decade_queue.py

      - name: Committen und pushen
        env:
          DECADE_QUEUE_KEY: ${{ steps.pick.outputs.decade }}
        run: |
          tools/push_retry.sh "${DECADE_QUEUE_KEY}: UK-Charts-Hits nachgezogen" \
          'DECADE_TIME_BUDGET_SECONDS=$REDO_BUDGET_SECONDS python3 tools/process_decade_queue.py' \
          "queue/${DECADE_QUEUE_KEY}-erweiterung.json" "queue/${DECADE_QUEUE_KEY}-erweiterung-notfound.json" "${DECADE_QUEUE_KEY}-music/songs.json"

  bpm:
    name: BPM-Werte ermitteln
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JOB_LIMIT_SECONDS: '5700'
    needs: uk
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'bpm') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Abhaengigkeiten installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsndfile1 ffmpeg
          pip install --quiet yt-dlp librosa numpy

      - name: Dekade bestimmen
        id: pick
        env:
          INPUT_DECADE: ${{ inputs.dekade }}
        run: |
          if [ -n "$INPUT_DECADE" ] && [ "$INPUT_DECADE" != "auto" ]; then
            echo "decade=$INPUT_DECADE" >> "$GITHUB_OUTPUT"
          else
            python3 tools/pick_bpm_decade.py >> "$GITHUB_OUTPUT"
          fi

      - name: BPM-Werte ermitteln
        env:
          BPM_TIME_BUDGET_SECONDS: '5400'
        run: python3 bpm_fetch.py "${{ steps.pick.outputs.decade }}"

      - name: Committen und pushen
        env:
          BPM_DECADE_KEY: ${{ steps.pick.outputs.decade }}
        run: |
          tools/push_retry.sh "BPM-Werte fuer ${BPM_DECADE_KEY} ergaenzt" \
          'python3 bpm_fetch.py "${BPM_DECADE_KEY}"' \
          "${BPM_DECADE_KEY}-music/songs.json"

  statistik:
    name: Song-Statistik aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB_LIMIT_SECONDS: '1200'
    needs: bpm
    if: ${{ !cancelled() && (inputs.nur == '' || inputs.nur == 'alle' || inputs.nur == 'statistik') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # fuer sitemap.xml (git log)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Startzeit merken
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Zaehlen und Sitemap erzeugen
        run: |
          python3 tools/count_songs.py
          python3 tools/build_sitemap.py

      - name: Committen und pushen
        run: |
          tools/push_retry.sh "Song-Statistik aktualisiert" \
          'python3 tools/count_songs.py && python3 tools/build_sitemap.py' \
          dekaden/stats.json sitemap.xml

  # Ersatz fuer workflow_run (Forgejo kennt es nicht): am Ende melden wir dem Caretaker,
  # ob der Lauf geklappt hat. Er schliesst Tickets bzw. startet bei Fehlern neu.
  meldung:
    needs: [fehlende, aufrufzahlen, billboard, uk, bpm, statistik]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Caretaker rufen
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          KETTE: ${{ (github.event_name == 'schedule' || inputs.kette == 'true') && 'true' || '' }}
          NUR: ${{ inputs.nur || github.event.inputs.nur }}
          R_fehlende: ${{ needs.fehlende.result }}
          R_aufrufzahlen: ${{ needs.aufrufzahlen.result }}
          R_billboard: ${{ needs.billboard.result }}
          R_uk: ${{ needs.uk.result }}
          R_bpm: ${{ needs.bpm.result }}
          R_statistik: ${{ needs.statistik.result }}
        run: |
          RES=success
          echo "NUR='$NUR' fehlende=$R_fehlende aufrufzahlen=$R_aufrufzahlen billboard=$R_billboard uk=$R_uk bpm=$R_bpm statistik=$R_statistik"
          # Einzelschritt (nur=...): uebersprungene Jobs melden 'failure', nur den gewaehlten werten
          if [ -n "$NUR" ] && [ "$NUR" != alle ]; then
            RESULTS=$(printenv "R_$NUR")
          else
            RESULTS="$R_fehlende $R_aufrufzahlen $R_billboard $R_uk $R_bpm $R_statistik"
          fi
          for r in $RESULTS; do case "$r" in failure|cancelled) RES=failure;; esac; done
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"workflow\":\"nachts.yml\",\"result\":\"$RES\",\"kette\":\"$KETTE\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/caretaker.yml/dispatches" \
            && echo "Caretaker gerufen: nachts.yml -> $RES" || echo "Caretaker konnte nicht gerufen werden (Rechte?)"

      - name: Tageskette - naechster Schritt (karaoke-songs.yml)
        if: ${{ always() && (github.event_name == 'schedule' || inputs.kette == 'true') }}
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"kette\":\"true\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/karaoke-songs.yml/dispatches" \
            && echo "Tageskette: karaoke-songs.yml gestartet" || { echo "::error::Tageskette: karaoke-songs.yml konnte nicht gestartet werden"; exit 1; }
