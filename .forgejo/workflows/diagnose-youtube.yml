name: YouTube-Diagnose

# Nur von Hand startbar. Prueft auf dem Runner, ob der YOUTUBE_API_KEY gesetzt ist und die YouTube-Data-API
# antwortet (Status, Fehlergrund, Trefferzahl) und ob yt-dlp (Standard-Client) Treffer liefert.
# Gibt NIE den Schluessel aus. Kostet 3 API-Suchen (300 Kontingent-Einheiten).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SafeSearch und Nachbarlieder
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time
          key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          def n(**p):
              p.update(key=key, part="snippet", maxResults="5", type="video")
              try:
                  with urllib.request.urlopen("https://www.googleapis.com/youtube/v3/search?" + urllib.parse.urlencode(p), timeout=20) as r:
                      d = json.loads(r.read().decode()); return len(d.get("items", []))
              except urllib.error.HTTPError as e:
                  return "HTTP %s" % e.code
          for q in ("Violent Femmes Gone Daddy Gone", "ABC The Flames of Desire", "Donell Jones This Luv", "Twisted Sister Hot Love",
                    "Violent Femmes Blister in the Sun", "ABC Poison Arrow", "Donell Jones U Know What's Up", "Twisted Sister We're Not Gonna Take It"):
              print("%-42s moderate(Standard)=%s | none=%s | strict=%s" % (q, n(q=q), n(q=q, safeSearch="none"), n(q=q, safeSearch="strict")))
              time.sleep(0.5)
          PY
