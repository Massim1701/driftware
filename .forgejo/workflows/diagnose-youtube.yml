name: YouTube-Diagnose

# Nur von Hand startbar. Prueft auf dem Runner, ob der YOUTUBE_API_KEY gesetzt ist und die YouTube-Data-API
# antwortet (Status, Fehlergrund, Trefferzahl) und ob yt-dlp (Standard-Client) Treffer liefert.
# Gibt NIE den Schluessel aus. Kostet 3 API-Suchen (300 Kontingent-Einheiten).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Varianten der Suche
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time
          key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          def n(**p):
              p.update(key=key, part="snippet", maxResults="5")
              try:
                  with urllib.request.urlopen("https://www.googleapis.com/youtube/v3/search?" + urllib.parse.urlencode(p), timeout=20) as r:
                      d = json.loads(r.read().decode()); return len(d.get("items", [])), [i["snippet"]["title"][:50] for i in d.get("items", [])[:1]]
              except urllib.error.HTTPError as e:
                  return "HTTP %s" % e.code, e.read().decode()[:120]
          T = "Violent Femmes Gone Daddy Gone"
          tests = [("Original, type=video", dict(q=T, type="video")),
                   ("ohne type", dict(q=T)),
                   ("Reihenfolge getauscht", dict(q="Gone Daddy Gone Violent Femmes", type="video")),
                   ("mit Official Video", dict(q=T + " official video", type="video")),
                   ("Musik-Kategorie", dict(q=T, type="video", videoCategoryId="10")),
                   ("Bindestrich", dict(q="Violent Femmes - Gone Daddy Gone", type="video")),
                   ("Anfrage mit Anfuehrungszeichen", dict(q='"Gone Daddy Gone" Violent Femmes', type="video")),
                   ("ABC ohne type", dict(q="ABC The Flames of Desire")),
                   ("ABC mit Hyphen", dict(q="ABC - The Flames of Desire", type="video")),
                   ("Donell ohne type", dict(q="Donell Jones This Luv")),
                   ("Twisted Sister Hot Love", dict(q="Twisted Sister Hot Love", type="video")),
                   ("Duran Duran The Reflex", dict(q="Duran Duran The Reflex", type="video")),
                   ("Rick (Kontrolle)", dict(q="Rick Astley Never Gonna Give You Up", type="video")),
                   ("Original nochmal", dict(q=T, type="video"))]
          for name, p in tests:
              print("%-32s -> %s" % (name, n(**p))); time.sleep(1)
          PY
