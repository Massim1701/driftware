name: YouTube-Diagnose

# Nur von Hand startbar. Prueft auf dem Runner, ob der YOUTUBE_API_KEY gesetzt ist und die YouTube-Data-API
# antwortet (Status, Fehlergrund, Trefferzahl) und ob yt-dlp (Standard-Client) Treffer liefert.
# Gibt NIE den Schluessel aus. Kostet 3 API-Suchen (300 Kontingent-Einheiten).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regionstest
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, time
          key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          def api(path, **p):
              p["key"] = key
              try:
                  with urllib.request.urlopen("https://www.googleapis.com/youtube/v3/%s?%s" % (path, urllib.parse.urlencode(p)), timeout=20) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"fehler": e.code, "text": e.read().decode()[:150]}
          Q = ["Violent Femmes Gone Daddy Gone", "ABC The Flames of Desire", "Donell Jones This Luv", "Twisted Sister Hot Love"]
          for q in Q:
              erg = {}
              for rc in ("DE", "US", "GB", "NL"):
                  d = api("search", part="snippet", q=q, type="video", maxResults="3", regionCode=rc)
                  erg[rc] = [i["id"]["videoId"] for i in d.get("items", [])]
                  time.sleep(0.5)
              print(q, "->", {k: len(v) for k, v in erg.items()})
              ids = erg["US"] or erg["GB"] or erg["NL"]
              if ids:
                  v = api("videos", part="contentDetails,status,snippet", id=ids[0])
                  it = (v.get("items") or [{}])[0]
                  cd = it.get("contentDetails", {}); st = it.get("status", {})
                  print("   Video", ids[0], "|", it.get("snippet", {}).get("title", "")[:55], "| Kanal:", it.get("snippet", {}).get("channelTitle"),
                        "| regionRestriction:", cd.get("regionRestriction"), "| embeddable:", st.get("embeddable"), "| in DE-Suche:", ids[0] in erg["DE"])
          PY
