name: Anreicherungs-Kette

# Haelt die Discogs-Anreicherung (merge_songs.yml, schritt=anreichern) am Laufen, ohne
# dass ein Rechner anbleiben muss: Jeder merge_songs-Lauf weckt diesen Workflow am Ende
# (letzter Schritt dort, Forgejo hat kein workflow_run); er startet dann den naechsten noetigen Lauf (Reihenfolge siehe tools/anreichern_kette.sh).
# Pausieren: Datei kette-pause.txt im Repo-Stamm anlegen.
# Von Hand anstossen: Actions -> Anreicherungs-Kette -> Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: anreichern-kette
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  weiter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Naechsten Lauf starten, falls noch etwas offen ist
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/anreichern_kette.sh
