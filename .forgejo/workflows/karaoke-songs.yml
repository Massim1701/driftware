name: Karaoke-Songs nachziehen

# Sucht pro Song die STUDIOFASSUNG ("Interpret - Topic"-Audio von YouTube), auf die die
# LRCLIB-Zeitstempel passen, und zieht die Songs in die Karaoke-Kachel nach
# (tools/fetch_karaoke_videos.py + tools/sync_karaoke_tile.py).
# Keine Mixe, Remixe, Live-, Extended- oder Edit-Versionen -- weder beim Song noch beim Video.
#
# Daten: karaoke/videos.json + karaoke/status.json (schreibt nur dieser Workflow).
# Die Kachel (Kategorie "Karaoke" in den Dekaden, "TextLaeuftMit" bei der Stimmung Karaoke)
# wird daraus deterministisch neu gebaut und mit committet.
#
# Zeitplan: kein eigener -- dritter Schritt der Tageskette (check-dead-videos -> nachts -> karaoke-songs
# -> backup-fornetta). Ein Lauf dauert hoechstens 60 Minuten, damit der einzige Runner nicht stundenlang
# blockiert ist (Waechter, Caretaker, Backup kommen dazwischen dran). Sind danach noch Songs offen, reiht
# sich der Workflow am Ende hinten neu ein (meldung, Schritt "Neu einreihen"). Ist alles erledigt, endet
# ein Lauf nach Sekunden und es wird nichts mehr eingereiht.
# Bei einer YouTube-Sperre (viele Fehler in Folge) bricht der Lauf von selbst ab und reiht sich nicht neu ein.
on:
  workflow_dispatch:
    inputs:
      kette:
        description: 'Von der Tageskette gesetzt: danach backup-fornetta starten (von Hand leer lassen)'
        required: false
        type: string
        default: ''
      limit:
        description: 'Optional: hoechstens so viele Songs (zum Testen), leer = bis Zeitbudget'
        required: false
        type: string
        default: ''

concurrency:
  group: karaoke-songs
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  karaoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      weiter: ${{ steps.fortschritt.outputs.weiter }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install --quiet yt-dlp ytmusicapi

      - name: Studiofassungen suchen
        timeout-minutes: 75
        env:
          KARAOKE_TIME_BUDGET_SECONDS: '3600'
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          if [ -n "$LIMIT" ]; then
            python3 tools/fetch_karaoke_videos.py --limit "$LIMIT" 2>&1 | tee /tmp/karaoke-lauf.log
          else
            python3 tools/fetch_karaoke_videos.py 2>&1 | tee /tmp/karaoke-lauf.log
          fi

      - name: Fortschritt auswerten (neu einreihen?)
        id: fortschritt
        if: always()
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          # Neu einreihen nur, wenn noch Songs offen sind, dieser Lauf etwas geschafft hat und
          # keine YouTube-Sperre erkannt wurde (sonst Endlosschleife). Mit LIMIT (Test) nie.
          WEITER=false
          if [ -z "$LIMIT" ] && [ -f /tmp/karaoke-lauf.log ]; then
            OFFEN=$(sed -n 's/.*Noch offen: \([0-9]*\)\..*/\1/p' /tmp/karaoke-lauf.log | tail -1)
            DONE=$(sed -n 's/^Fertig fuer diesen Lauf: \([0-9]*\) bearbeitet.*/\1/p' /tmp/karaoke-lauf.log | tail -1)
            SPERRE=$(grep -c 'Zu viele YouTube-Fehler' /tmp/karaoke-lauf.log || true)
            echo "offen=${OFFEN:-?} bearbeitet=${DONE:-?} sperre=$SPERRE"
            if [ "${OFFEN:-0}" -gt 0 ] && [ "${DONE:-0}" -gt 0 ] && [ "$SPERRE" = "0" ]; then WEITER=true; fi
          fi
          echo "weiter=$WEITER" >> "$GITHUB_OUTPUT"
          echo "Neu einreihen: $WEITER"

      - name: Karaoke-Kachel neu bauen
        if: always()
        run: python3 tools/sync_karaoke_tile.py

      - name: Committen und pushen
        # auch nach Abbruch: Zwischenstand sichern
        if: always()
        run: |
          git config user.name "driftware-bot"
          git config user.email "actions@users.noreply.github.com"
          git add karaoke/videos.json karaoke/status.json karaoke/ausschluss.json \
            70er-music/songs.json 80er-music/songs.json 90er-music/songs.json \
            2000er-music/songs.json 2010er-music/songs.json 2020er-music/songs.json karaoke-music/songs.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "Karaoke-Songs nachgezogen (Studiofassungen)"

          # Andere Workflows aendern dieselben songs.json. Bei einem Rebase-Konflikt wird nicht von Hand
          # zusammengefuehrt, sondern auf den frischen Remote-Stand zurueckgesetzt: die Karaoke-Daten
          # (karaoke/*.json) bleiben erhalten, die Kachel wird daraus neu gebaut (deterministisch).
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push erfolgreich (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt (Versuch $i), hole Remote-Stand..."
            git fetch origin "$GITHUB_REF_NAME"
            if git rebase --autostash "origin/$GITHUB_REF_NAME"; then
              continue
            fi
            git rebase --abort || true
            rm -rf /tmp/karaoke-keep && mkdir -p /tmp/karaoke-keep
            cp karaoke/videos.json karaoke/status.json /tmp/karaoke-keep/
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/karaoke-keep/videos.json /tmp/karaoke-keep/status.json karaoke/
            python3 tools/sync_karaoke_tile.py
            git add karaoke/videos.json karaoke/status.json \
              70er-music/songs.json 80er-music/songs.json 90er-music/songs.json \
              2000er-music/songs.json 2010er-music/songs.json 2020er-music/songs.json karaoke-music/songs.json
            git commit -m "Karaoke-Songs nachgezogen (Studiofassungen)" || exit 0
          done
          echo "::error::Push nach mehreren Versuchen fehlgeschlagen."
          exit 1

  # Ersatz fuer workflow_run (Forgejo kennt es nicht): am Ende melden wir dem Caretaker,
  # ob der Lauf geklappt hat. Er schliesst Tickets bzw. startet bei Fehlern neu.
  meldung:
    needs: [karaoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Caretaker rufen
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
          KETTE: ${{ (github.event_name == 'schedule' || inputs.kette == 'true') && 'true' || '' }}
          RESULTS: ${{ needs.karaoke.result }}
        run: |
          RES=success
          for r in $RESULTS; do case "$r" in failure|cancelled) RES=failure;; esac; done
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"workflow\":\"karaoke-songs.yml\",\"result\":\"$RES\",\"kette\":\"$KETTE\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/caretaker.yml/dispatches" \
            && echo "Caretaker gerufen: karaoke-songs.yml -> $RES" || echo "Caretaker konnte nicht gerufen werden (Rechte?)"

      - name: Tageskette - naechster Schritt (backup-fornetta.yml)
        if: ${{ always() && (github.event_name == 'schedule' || inputs.kette == 'true') }}
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "{\"ref\":\"master\",\"inputs\":{\"kette\":\"true\"}}" \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/backup-fornetta.yml/dispatches" \
            && echo "Tageskette: backup-fornetta.yml gestartet" || { echo "::error::Tageskette: backup-fornetta.yml konnte nicht gestartet werden"; exit 1; }

      - name: Neu einreihen (Karaoke weiter, nach den anderen Jobs)
        # Als LETZTER Schritt: Backup, Waechter und Caretaker stehen dann schon vor uns in der Warteschlange.
        if: ${{ always() && needs.karaoke.outputs.weiter == 'true' }}
        env:
          TOKEN: ${{ secrets.FORGEJO_TOKEN || github.token }}
        run: |
          # Nachtfenster 02:00-03:20 UTC: nicht neu einreihen, damit der einzige Runner um 03:15
          # fuer die Tageskette (Tote Videos -> Nachtlauf -> Karaoke -> Backup) frei ist. Karaoke
          # laeuft danach als Teil der Kette weiter (und reiht sich dann wieder selbst ein).
          # Eingefuehrt 03.11.2026: die Kette startete sonst erst 06:04 statt 03:15.
          MINUTEN=$((10#$(date -u +%H%M)))
          if [ "$MINUTEN" -ge 200 ] && [ "$MINUTEN" -lt 320 ]; then
            echo "Nachtfenster (02:00-03:20 UTC): Karaoke wird nicht neu eingereiht, die Tageskette startet Karaoke selbst."
            exit 0
          fi
          API="${GITHUB_API_URL:-http://192.168.0.50:3000/api/v1}"
          curl -fsS -m 30 -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d '{"ref":"master","inputs":{}}' \
            "$API/repos/$GITHUB_REPOSITORY/actions/workflows/karaoke-songs.yml/dispatches" \
            && echo "Karaoke neu eingereiht" || echo "::warning::Karaoke konnte nicht neu eingereiht werden (naechste Tageskette macht weiter)"
