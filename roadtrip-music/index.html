<body>
<div id="decade-root"></div>
<script src="../shared/decades.js?v=16"></script>
<script>
renderDecadeIndex({
  name: 'Road Trip',
  years: 'Alle Jahrzehnte',
  icon: '🚗',
  iconBg: 'linear-gradient(135deg, #ff6b35, #2b2d42)',
  tagline: 'Classic Rock, AOR und Synthwave aus allen Jahrzehnten — der Soundtrack für die lange Fahrt.',

    text: '#fdf5ee',
    muted: '#b3a5c2'

  dataUrl: 'songs.json?v=1',
  csvPrefix: 'RoadTrip',

    { key: 'ClassicRock', label: 'Classic Rock' },
