<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiser — driftware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #12080b;
  --card: #1c1013;
  --card-2: #221419;
  --border: #3a1f26;
  --text: #f7ecd9;
  --muted: #b89a86;
  --gold: #d4af37;
  --gold-soft: rgba(212,175,55,.12);
  --wine: #8a1538;
  --danger: #d9776a;
  --good: #7fbf8f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 0%, #23111a, var(--bg) 65%);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
}
a { color: var(--gold); }

header {
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 20px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand .crown { font-size: 19px; }
.homelink { font-size: 13px; color: var(--muted); text-decoration: none; }
.homelink:hover { color: var(--gold); }

main { max-width: 1080px; margin: 0 auto; padding: 20px 20px 80px; }

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 22px;
}
.game-header h1 {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  margin: 0 0 4px;
}
.game-header .sub { color: var(--muted); font-size: 13px; }
.round-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  text-align: right;
  font-size: 13px;
}
.round-box .r-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.round-box .r-time { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); }

.grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 20px;
}
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  margin-bottom: 20px;
}
.panel h2 {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  margin: 0 0 4px;
}
.panel .panel-sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.stat {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.stat .value { font-family: 'Cinzel', serif; font-size: 20px; margin-top: 2px; }
.rank-pill {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 12px;
}

.building-row, .army-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.building-row:last-child, .army-row:last-child { border-bottom: none; }
.building-row .b-name { font-weight: 600; font-size: 14px; }
.building-row .b-cost { color: var(--muted); font-size: 12px; }
.building-row .b-count {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  min-width: 24px;
  text-align: center;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--wine), #6e1029);
  color: #fff2ea;
  border: 1px solid #a83a5c;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

.recruit-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.recruit-row input {
  width: 70px;
  background: #0f0709;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}

.realm-list { display: flex; flex-direction: column; gap: 8px; }
.realm-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
}
.realm-row .r-name { font-weight: 600; }
.realm-row .r-rank { color: var(--gold); font-size: 12px; }
.realm-row.self { border-color: var(--gold); }

.trade-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.trade-form .field { display: flex; flex-direction: column; gap: 4px; }
.trade-form label { font-size: 11px; color: var(--muted); }
.trade-form select, .trade-form input {
  background: #0f0709;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  width: 100px;
}
.trade-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 13px;
  flex-wrap: wrap;
  gap: 8px;
}
.trade-row .t-desc strong { color: var(--gold); }
.trade-row .t-from { color: var(--muted); font-size: 12px; }
.msg { font-size: 13px; margin-top: 12px; }
.msg.error { color: var(--danger); }
.msg.success { color: var(--good); }
.loading, .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
<div class="brand"><span class="crown">👑</span> Kaiser</div>
<a class="homelink" href="index.html">← Partien-Übersicht</a>
</header>

<main id="main-content">
<div class="loading" style="padding:40px 0; text-align:center;">Lade Reich …</div>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://ffwnxdlncogvlpqsmiib.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_saPgbKa-NyqS4JBuLmOc-A_gJo9y1xS';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var params = new URLSearchParams(window.location.search);
  var gameId = params.get('id');
  var main = document.getElementById('main-content');

  var BUILDING_LABELS = {
    markt: 'Markt', muehle: 'Mühle', mauer: 'Mauer', palast: 'Palast', kathedrale: 'Kathedrale', hof: 'Hof', waffenschmiede: 'Waffenschmiede'
  };
  var RANK_LABELS = {
    gutsherr: 'Gutsherr', freiherr: 'Freiherr', ritter: 'Ritter', graf: 'Graf', markgraf: 'Markgraf',
    herzog: 'Herzog', kurfuerst: 'Kurfürst', erzherzog: 'Erzherzog', koenig: 'König', kaiser: 'Kaiser'
  };

  if (!gameId) {
    main.innerHTML = '<div class="empty">Keine Partie ausgewählt. <a href="index.html">Zurück zur Übersicht</a></div>';
    return;
  }

  var state = {};

  function fmt(n) {
    return Math.round(n).toLocaleString('de-DE');
  }

  function loadAll() {
    sb.auth.getUser().then(function (userRes) {
      if (!userRes.data.user) { window.location.href = 'index.html'; return; }
      state.userId = userRes.data.user.id;

      sb.from('games').select('*').eq('id', gameId).single().then(function (gameRes) {
        if (gameRes.error || !gameRes.data) {
          main.innerHTML = '<div class="empty">Partie nicht gefunden.</div>';
          return;
        }
        state.game = gameRes.data;

        sb.from('game_players').select('*, realms(*), factions(name,bild_datei)').eq('game_id', gameId).then(function (gpRes) {
          if (gpRes.error) {
            main.innerHTML = '<div class="empty">Fehler beim Laden.</div>';
            return;
          }
          state.players = gpRes.data;
          state.myPlayer = gpRes.data.find(function (p) { return p.user_id === state.userId; });

          if (!state.myPlayer) {
            main.innerHTML = '<div class="empty">Du bist kein Teil dieser Partie.</div>';
            return;
          }
          state.myRealm = state.myPlayer.realms;

          sb.from('rounds').select('*').eq('game_id', gameId).order('round_number', { ascending: false }).limit(1).then(function (roundRes) {
            state.currentRound = roundRes.data && roundRes.data[0];

            sb.from('buildings').select('*').eq('realm_id', state.myRealm.id).then(function (buildRes) {
              state.buildings = {};
              (buildRes.data || []).forEach(function (b) { state.buildings[b.typ] = b.anzahl; });

              sb.from('military').select('*').eq('realm_id', state.myRealm.id).maybeSingle().then(function (milRes) {
                state.military = milRes.data || { soldaten: 0, ausruestung_level: 1 };

                sb.from('trades').select('*').eq('game_id', gameId).eq('status', 'offen').order('created_at', { ascending: false }).then(function (tradeRes) {
                  state.trades = tradeRes.data || [];
                  sb.from('events').select('*').eq('game_id', gameId).order('round_number', { ascending: false }).limit(1).then(function (evRes) {
                    state.lastEvent = evRes.data && evRes.data[0];
                    render();
                  });
                });
              });
            });
          });
        });
      });
    });
  }

  function render() {
    var g = state.game;
    var r = state.myRealm;
    var isCreator = g.created_by === state.userId;

    var roundInfo = '';
    if (g.status === 'offen') {
      roundInfo = '<div class="r-label">Status</div><div class="r-time">Wartet auf Start</div>';
    } else if (state.currentRound) {
      var closes = new Date(state.currentRound.closes_at);
      roundInfo = '<div class="r-label">Runde ' + g.current_round + ' — endet automatisch</div><div class="r-time">' + closes.toLocaleString('de-DE') + '</div>';
    }

    var html = '';
    html += '<div class="game-header">';
    html += '<div><h1>' + escapeHtml(g.name) + '</h1><div class="sub">' + state.players.length + ' / ' + g.max_players + ' Spieler</div></div>';
    html += '<div class="round-box">' + roundInfo + '</div>';
    html += '</div>';

    if (state.lastEvent && state.lastEvent.round_number === g.current_round - 1) {
      var evLabel = { missernte: '🌧️ Missernte in der letzten Runde', gute_ernte: '☀️ Gute Ernte in der letzten Runde', seuche: '☠️ Seuche in der letzten Runde', angriff: '⚔️ Angriff in der letzten Runde' };
      html += '<div class="panel" style="padding:12px 18px; margin-bottom:16px;"><span class="rank-pill">' + (evLabel[state.lastEvent.typ] || state.lastEvent.typ) + '</span></div>';
    }

    if (g.status === 'offen') {
      html += '<div class="panel"><h2>Partie noch nicht gestartet</h2><p class="panel-sub">Sobald genug Spieler beigetreten sind, kann ';
      html += (isCreator ? 'der Gründer die Partie starten.' : 'der Gründer die Partie starten. Warte, bis es losgeht.');
      html += '</p>';
      if (isCreator) {
        html += '<button class="btn-primary" id="start-btn">Partie starten</button>';
      }
      html += '<div class="msg" id="action-msg"></div></div>';
    }

    html += '<div class="grid"><div>';

    // Ressourcen
    var myCrest = state.myPlayer.factions ? '<img src="assets/factions/' + state.myPlayer.factions.bild_datei + '" alt="" style="width:28px;height:35px;border-radius:4px;vertical-align:middle;margin-right:8px;">' : '';
    var bevCap = Math.floor(r.land_hektar * 0.15);
    var preisProHa = (1 + r.bevoelkerung / 1000).toFixed(2);
    html += '<div class="panel"><h2>' + myCrest + 'Dein Reich</h2><p class="panel-sub">' + escapeHtml(state.myPlayer.reich_name) + '</p>';
    html += '<div class="stat-grid">';
    html += stat('Land', fmt(r.land_hektar) + ' ha');
    html += stat('Taler', fmt(r.taler));
    html += stat('Getreide', fmt(r.getreide_vorrat));
    html += stat('Bevölkerung', fmt(r.bevoelkerung) + ' / ' + fmt(bevCap));
    html += stat('Holz', fmt(r.holz));
    html += stat('Wolle', fmt(r.wolle));
    html += stat('Eisen', fmt(r.eisen));
    html += '</div><span class="rank-pill">' + (RANK_LABELS[r.rang] || r.rang) + '</span>';
    html += '<p class="panel-sub" style="margin-top:10px;">Getreide letzte Runde: <strong>+' + fmt(r.getreide_ertrag_letzte_runde) + ' geerntet</strong> · <strong>−' + fmt(r.getreide_bedarf_letzte_runde) + ' verbraucht</strong> (0,5 pro Kopf)</p>';
    html += '<p class="panel-sub">Bevölkerung letzte Runde: <strong style="color:var(--good, #7fbf8f);">+' + fmt(r.geburten_letzte_runde) + ' geboren</strong> · <strong style="color:var(--danger);">−' + fmt(r.tote_letzte_runde) + ' verstorben</strong></p>';

    html += '<div style="margin-top:16px;"><label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Land kaufen — ' + preisProHa + ' Taler/ha (steigt mit der Bevölkerung)</label>';
    html += '<div style="display:flex; gap:8px;"><input type="number" id="land-hektar" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="buy-land-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Kaufen</button></div>';
    html += '<div class="msg" id="land-msg"></div></div>';

    html += '<div style="margin-top:16px;"><label style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;">Steuersatz <span id="tax-value">' + r.steuersatz + '%</span></label>';
    html += '<input type="range" id="tax-slider" min="1" max="50" value="' + r.steuersatz + '" style="width:100%;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<p class="panel-sub" style="margin-top:6px;">Hohe Steuern bringen mehr Taler, senken aber die Geburtenrate und erhöhen die Sterblichkeit leicht.</p>';
    html += '<button class="btn-secondary" id="tax-save-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Steuersatz übernehmen</button>';
    html += '<div class="msg" id="tax-msg"></div></div>';
    html += '</div>';

    // Gebäude
    var BUILDING_MAX = { palast: 10, kathedrale: 15 };
    html += '<div class="panel"><h2>Gebäude</h2><p class="panel-sub">Markt erhöht Taler-Einkommen, Mühle die Ernte, Hof liefert Getreide/Holz/Wolle/Eisen, Waffenschmiede versorgt deine Soldaten. Palast (10 Stufen) und Kathedrale (15 Stufen) werden Stück für Stück ausgebaut.</p>';
    ['hof', 'markt', 'muehle', 'waffenschmiede', 'mauer', 'palast', 'kathedrale'].forEach(function (typ) {
      var cost = BUILDING_COSTS[typ];
      var count = state.buildings[typ] || 0;
      var max = BUILDING_MAX[typ];
      var maxedOut = max && count >= max;
      html += '<div class="building-row">';
      html += '<div><div class="b-name">' + BUILDING_LABELS[typ] + '</div><div class="b-cost">' + fmt(cost) + ' Taler</div></div>';
      html += '<div style="display:flex;align-items:center;gap:14px;">';
      html += '<div class="b-count">' + count + (max ? ' / ' + max : '') + '</div>';
      html += '<button class="btn-secondary" data-build="' + typ + '"' + (g.status !== 'laufend' || maxedOut ? ' disabled' : '') + '>' + (maxedOut ? 'Fertig' : 'Bauen') + '</button>';
      html += '</div></div>';
    });
    html += '<div class="msg" id="build-msg"></div></div>';

    // Dynastie
    html += '<div class="panel"><h2>Dynastie</h2>';
    if (r.verheiratet) {
      html += '<p class="panel-sub">Verheiratet' + (r.ehepartner_name ? ' mit ' + escapeHtml(r.ehepartner_name) : '') + '. Generation ' + fmt(r.generationen) + '.</p>';
      html += '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">';
      html += stat('Erben bereit', fmt(r.kinder));
      html += stat('Runden bis Thronwechsel', fmt(Math.max(0, 20 - r.runden_seit_thronbesteigung)));
      html += '</div><p class="panel-sub" style="margin-top:8px;">Alle 20 Runden übernimmt ein Erbe den Thron — mit kleinem Verlust an Taler und Bevölkerung. Ohne bereitstehenden Erben wird gewartet.</p>';
    } else {
      html += '<p class="panel-sub">Noch unverheiratet. Ohne Ehe entstehen keine Erben, und dein Reich endet mit dir.</p>';
      html += '<input type="text" id="partner-name" maxlength="30" placeholder="Name des Ehepartners (optional)" style="width:100%; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px; margin-bottom:8px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
      html += '<button class="btn-primary" id="marry-btn" style="margin-top:0; width:auto; padding:9px 18px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Heiraten</button>';
    }
    html += '<div class="msg" id="marry-msg"></div></div>';

    html += '</div><div>';

    // Militär
    html += '<div class="panel"><h2>Militär</h2><p class="panel-sub">50 Taler je Soldat. Jeder Soldat verbraucht 0,2 Holz + 0,3 Eisen pro Runde — eine Waffenschmiede hält die Truppe versorgt und verbessert ihre Ausrüstung. Fehlt Nachschub, desertieren Soldaten.</p>';
    html += '<div class="stat-grid" style="margin-bottom:14px;">';
    html += stat('Soldaten', fmt(state.military.soldaten));
    html += stat('Ausrüstung', 'Stufe ' + state.military.ausruestung_level);
    html += '</div>';
    html += '<div class="recruit-row"><input type="number" id="recruit-count" value="10" min="1">';
    html += '<button class="btn-primary" id="recruit-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Anwerben</button></div>';
    html += '<div class="msg" id="recruit-msg"></div></div>';

    // Marktplatz
    var realmNameById = {};
    state.players.forEach(function (p) { if (p.realms) realmNameById[p.realms.id] = p.reich_name; });

    html += '<div class="panel"><h2>Marktplatz</h2><p class="panel-sub">Angebote anderer Reiche annehmen oder eigenes einstellen.</p>';
    html += '<div class="trade-form">';
    html += '<div class="field"><label>Ware</label><select id="trade-ware"><option value="getreide">Getreide</option><option value="holz">Holz</option><option value="wolle">Wolle</option><option value="eisen">Eisen</option></select></div>';
    html += '<div class="field"><label>Menge</label><input type="number" id="trade-menge" value="100" min="1"></div>';
    html += '<div class="field"><label>Preis je Einheit (Taler)</label><input type="number" id="trade-preis" value="1" min="0" step="0.1"></div>';
    html += '<button class="btn-secondary" id="offer-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Anbieten</button>';
    html += '</div>';

    var myOffers = state.trades.filter(function (t) { return t.from_realm_id === state.myRealm.id; });
    var otherOffers = state.trades.filter(function (t) { return t.from_realm_id !== state.myRealm.id; });

    if (!state.trades.length) {
      html += '<div class="empty">Aktuell keine offenen Angebote.</div>';
    } else {
      otherOffers.forEach(function (t) {
        html += tradeRow(t, realmNameById, true);
      });
      myOffers.forEach(function (t) {
        html += tradeRow(t, realmNameById, false);
      });
    }
    html += '<div class="msg" id="trade-msg"></div></div>';

    // Andere Reiche
    html += '<div class="panel"><h2>Reiche in dieser Partie</h2><div class="realm-list">';
    state.players.forEach(function (p) {
      var isSelf = p.id === state.myPlayer.id;
      html += '<div class="realm-row' + (isSelf ? ' self' : '') + '">';
      var crest = p.factions ? '<img src="assets/factions/' + p.factions.bild_datei + '" alt="" style="width:22px;height:27px;border-radius:3px;vertical-align:middle;margin-right:8px;">' : '';
      html += '<span class="r-name">' + crest + escapeHtml(p.reich_name) + (isSelf ? ' (du)' : '') + '</span>';
      html += '<span class="r-rank">' + (p.realms ? (RANK_LABELS[p.realms.rang] || p.realms.rang) : '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    if (isCreator && g.status === 'laufend') {
      html += '<button class="btn-secondary" id="advance-btn" style="margin-top:14px;">Runde vorzeitig abschließen</button>';
      html += '<div class="msg" id="advance-msg"></div>';
    }
    html += '</div>';

    html += '</div></div>';

    main.innerHTML = html;
    bindActions();
  }

  function tradeRow(t, realmNameById, showAccept) {
    var wareLabel = t.ware === 'getreide' ? 'Getreide' : 'Taler';
    var priceText = t.preis ? (' · ' + fmt(t.preis) + ' Taler/Einheit') : '';
    var html = '<div class="trade-row">';
    html += '<div><div class="t-desc"><strong>' + fmt(t.menge) + ' ' + wareLabel + '</strong>' + priceText + '</div>';
    html += '<div class="t-from">von ' + escapeHtml(realmNameById[t.from_realm_id] || 'Unbekannt') + '</div></div>';
    if (showAccept) {
      html += '<button class="btn-primary" style="padding:6px 14px;font-size:12px;" data-accept="' + t.id + '">Annehmen</button>';
    } else {
      html += '<span class="t-from">eigenes Angebot</span>';
    }
    html += '</div>';
    return html;
  }
