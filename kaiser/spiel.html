<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiser — driftware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #12080b;
  --card: #1c1013;
  --card-2: #221419;
  --border: #3a1f26;
  --text: #f7ecd9;
  --muted: #b89a86;
  --gold: #d4af37;
  --gold-soft: rgba(212,175,55,.12);
  --wine: #8a1538;
  --danger: #d9776a;
  --good: #7fbf8f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at 50% 0%, #23111a, var(--bg) 65%);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
}
a { color: var(--gold); }

header {
  max-width: 1500px;
  margin: 0 auto;
  padding: 24px 24px 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand .crown { font-size: 19px; }
.homelink { font-size: 13px; color: var(--muted); text-decoration: none; }
.homelink:hover { color: var(--gold); }

main { max-width: 1500px; margin: 0 auto; padding: 12px 24px 60px; }

.game-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 14px;
}
.game-header h1 {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  margin: 0 0 4px;
}
.game-header .sub { color: var(--muted); font-size: 13px; }
.round-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
  text-align: right;
  font-size: 13px;
}
.round-box .r-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.round-box .r-time { font-family: 'Cinzel', serif; font-size: 16px; color: var(--gold); }

.uebersicht {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}
.uebersicht .u-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--muted);
  flex: 1;
  min-width: 100px;
}
.uebersicht .u-item strong {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 16px;
  color: var(--text);
  margin-top: 1px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 1150px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
}
.panel h2 {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  margin: 0 0 4px;
}
.panel .panel-sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.stat {
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.stat .value { font-family: 'Cinzel', serif; font-size: 20px; margin-top: 2px; }
.rank-pill {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  color: var(--gold);
  background: var(--gold-soft);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 12px;
}

.building-row, .army-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.building-row:last-child, .army-row:last-child { border-bottom: none; }
.building-row .b-name { font-weight: 600; font-size: 14px; }
.building-row .b-cost { color: var(--muted); font-size: 12px; }
.building-row .b-count {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  min-width: 24px;
  text-align: center;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--wine), #6e1029);
  color: #fff2ea;
  border: 1px solid #a83a5c;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary:disabled { opacity: .5; cursor: default; }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
}
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

.recruit-row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.recruit-row input {
  width: 70px;
  background: #0f0709;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}

.realm-list { display: flex; flex-direction: column; gap: 8px; }
.realm-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
}
.realm-row .r-name { font-weight: 600; }
.realm-row .r-rank { color: var(--gold); font-size: 12px; }
.realm-row.self { border-color: var(--gold); }

.trade-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.trade-form .field { display: flex; flex-direction: column; gap: 4px; }
.trade-form label { font-size: 11px; color: var(--muted); }
.trade-form select, .trade-form input {
  background: #0f0709;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  width: 100px;
}
.karte-zelle {
  aspect-ratio: 1;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px;
  text-align: center;
}
.karte-zelle.self { border-color: var(--gold); }
.karte-zelle.adjacent { border-color: #a83a5c; }
.trade-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 13px;
  flex-wrap: wrap;
  gap: 8px;
}
.trade-row .t-desc strong { color: var(--gold); }
.trade-row .t-from { color: var(--muted); font-size: 12px; }
.msg { font-size: 13px; margin-top: 12px; }
.msg.error { color: var(--danger); }
.msg.success { color: var(--good); }
.loading, .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
<div class="brand"><span class="crown">👑</span> Kaiser</div>
<a class="homelink" href="index.html">← Partien-Übersicht</a>
</header>

<main id="main-content">
<div class="loading" style="padding:40px 0; text-align:center;">Lade Reich …</div>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://ffwnxdlncogvlpqsmiib.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_saPgbKa-NyqS4JBuLmOc-A_gJo9y1xS';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var params = new URLSearchParams(window.location.search);
  var gameId = params.get('id');
  var main = document.getElementById('main-content');

  var BUILDING_LABELS = {
    markt: 'Markt', muehle: 'Mühle', mauer: 'Mauer', palast: 'Palast', kathedrale: 'Kathedrale', hof: 'Hof', waffenschmiede: 'Waffenschmiede', hafen: 'Hafen', schule: 'Schule'
  };
  var RANK_LABELS = {
    gutsherr: 'Gutsherr', freiherr: 'Freiherr', ritter: 'Ritter', graf: 'Graf', markgraf: 'Markgraf',
    herzog: 'Herzog', kurfuerst: 'Kurfürst', erzherzog: 'Erzherzog', koenig: 'König', kaiser: 'Kaiser'
  };

  if (!gameId) {
    main.innerHTML = '<div class="empty">Keine Partie ausgewählt. <a href="index.html">Zurück zur Übersicht</a></div>';
    return;
  }

  var state = {};

  function fmt(n) {
    return Math.round(n).toLocaleString('de-DE');
  }

  function loadAll() {
    sb.auth.getUser().then(function (userRes) {
      if (!userRes.data.user) { window.location.href = 'index.html'; return; }
      state.userId = userRes.data.user.id;

      sb.from('games').select('*').eq('id', gameId).single().then(function (gameRes) {
        if (gameRes.error || !gameRes.data) {
          main.innerHTML = '<div class="empty">Partie nicht gefunden.</div>';
          return;
        }
        state.game = gameRes.data;

        sb.from('game_players').select('*, realms(*), factions(name,bild_datei)').eq('game_id', gameId).then(function (gpRes) {
          if (gpRes.error) {
            main.innerHTML = '<div class="empty">Fehler beim Laden.</div>';
            return;
          }
          state.players = gpRes.data;
          state.myPlayer = gpRes.data.find(function (p) { return p.user_id === state.userId; });

          if (!state.myPlayer) {
            main.innerHTML = '<div class="empty">Du bist kein Teil dieser Partie.</div>';
            return;
          }
          state.myRealm = state.myPlayer.realms;

          sb.from('rounds').select('*').eq('game_id', gameId).order('round_number', { ascending: false }).limit(1).then(function (roundRes) {
            state.currentRound = roundRes.data && roundRes.data[0];

            sb.from('buildings').select('*').eq('realm_id', state.myRealm.id).then(function (buildRes) {
              state.buildings = {};
              (buildRes.data || []).forEach(function (b) { state.buildings[b.typ] = b.anzahl; });

              sb.from('military').select('*').eq('realm_id', state.myRealm.id).maybeSingle().then(function (milRes) {
                state.military = milRes.data || { soldaten: 0, ausruestung_level: 1 };

                sb.from('trades').select('*').eq('game_id', gameId).eq('status', 'offen').order('created_at', { ascending: false }).then(function (tradeRes) {
                  state.trades = tradeRes.data || [];
                  sb.from('events').select('*').eq('game_id', gameId).order('round_number', { ascending: false }).limit(1).then(function (evRes) {
                    state.lastEvent = evRes.data && evRes.data[0];
                    sb.from('allianzen').select('*').eq('game_id', gameId).then(function (allRes) {
                      state.allianzen = allRes.data || [];
                      render();
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  }

  function render() {
    var g = state.game;
    var r = state.myRealm;
    var isCreator = g.created_by === state.userId;

    var roundInfo = '';
    if (g.status === 'offen') {
      roundInfo = '<div class="r-label">Status</div><div class="r-time">Wartet auf Start</div>';
    } else if (state.currentRound) {
      var closes = new Date(state.currentRound.closes_at);
      roundInfo = '<div class="r-label">Runde ' + g.current_round + ' — endet automatisch</div><div class="r-time">' + closes.toLocaleString('de-DE') + '</div>';
    }

    var html = '';
    html += '<div class="game-header">';
    html += '<div><h1>' + escapeHtml(g.name) + '</h1><div class="sub">' + state.players.length + ' / ' + g.max_players + ' Spieler</div></div>';
    html += '<div class="round-box">' + roundInfo;
    if (isCreator && g.status === 'laufend') {
      html += '<button class="btn-secondary" id="advance-btn" style="margin-top:8px; width:100%;">Runde vorzeitig abschließen</button>';
    }
    html += '</div>';
    html += '</div>';
    if (isCreator && g.status === 'laufend') {
      html += '<div class="msg" id="advance-msg" style="text-align:right; margin-top:-10px; margin-bottom:10px;"></div>';
    }

    if (g.status === 'laufend') {
      var bevCapU = Math.floor(r.land_hektar * 0.15);
      html += '<div class="uebersicht">';
      html += '<div class="u-item">Rang<strong>' + (RANK_LABELS[r.rang] || r.rang) + '</strong></div>';
      html += '<div class="u-item">Land<strong>' + fmt(r.land_hektar) + ' ha</strong></div>';
      html += '<div class="u-item">Taler<strong>' + fmt(r.taler) + '</strong></div>';
      html += '<div class="u-item">Getreide<strong>' + fmt(r.getreide_vorrat) + '</strong></div>';
      html += '<div class="u-item">Bevölkerung<strong>' + fmt(r.bevoelkerung) + ' / ' + fmt(bevCapU) + '</strong></div>';
      html += '<div class="u-item">Soldaten<strong>' + fmt(state.military.soldaten) + '</strong></div>';
      html += '<div class="u-item">Schulden<strong>' + fmt(r.schulden) + '</strong></div>';
      html += '</div>';
    }

    if (state.lastEvent && state.lastEvent.round_number === g.current_round - 1) {
      var evLabel = { missernte: '🌧️ Missernte in der letzten Runde', gute_ernte: '☀️ Gute Ernte in der letzten Runde', seuche: '☠️ Seuche in der letzten Runde', angriff: '⚔️ Angriff in der letzten Runde' };
      html += '<div class="panel" style="padding:12px 18px; margin-bottom:16px;"><span class="rank-pill">' + (evLabel[state.lastEvent.typ] || state.lastEvent.typ) + '</span></div>';
    }

    if (g.status === 'offen') {
      html += '<div class="panel"><h2>Partie noch nicht gestartet</h2><p class="panel-sub">Sobald genug Spieler beigetreten sind, kann ';
      html += (isCreator ? 'der Gründer die Partie starten.' : 'der Gründer die Partie starten. Warte, bis es losgeht.');
      html += '</p>';
      if (isCreator) {
        html += '<button class="btn-primary" id="start-btn">Partie starten</button>';
      }
      html += '<div class="msg" id="action-msg"></div></div>';
    }

    html += '<div class="grid"><div>';

    // Ressourcen
    var myCrest = state.myPlayer.factions ? '<img src="assets/factions/' + state.myPlayer.factions.bild_datei + '" alt="" style="width:28px;height:35px;border-radius:4px;vertical-align:middle;margin-right:8px;">' : '';
    var bevCap = Math.floor(r.land_hektar * 0.15);
    var preisProHa = (1 + r.bevoelkerung / 1000).toFixed(2);
    html += '<div class="panel"><h2>' + myCrest + 'Dein Reich</h2><p class="panel-sub">' + escapeHtml(state.myPlayer.reich_name) + '</p>';
    html += '<div class="stat-grid">';
    html += stat('Land', fmt(r.land_hektar) + ' ha');
    html += stat('Taler', fmt(r.taler));
    html += stat('Getreide', fmt(r.getreide_vorrat));
    html += stat('Bevölkerung', fmt(r.bevoelkerung) + ' / ' + fmt(bevCap));
    html += stat('Holz', fmt(r.holz));
    html += stat('Wolle', fmt(r.wolle));
    html += stat('Eisen', fmt(r.eisen));
    html += stat('Milch', fmt(r.milch));
    html += stat('Fleisch', fmt(r.fleisch));
    html += '</div><span class="rank-pill">' + (RANK_LABELS[r.rang] || r.rang) + '</span>';
    html += '<p class="panel-sub" style="margin-top:10px;">Getreide letzte Runde: <strong>+' + fmt(r.getreide_ertrag_letzte_runde) + ' geerntet</strong> · <strong>−' + fmt(r.getreide_bedarf_letzte_runde) + ' verbraucht</strong> (0,5 pro Kopf)' + (r.diebe_letzte_runde > 0 ? ' · <strong style="color:var(--danger);">−' + fmt(r.getreide_gestohlen_letzte_runde) + ' gestohlen (' + fmt(r.diebe_letzte_runde) + ' Diebe)</strong>' : '') + '</p>';
    html += '<p class="panel-sub">Bevölkerung letzte Runde: <strong style="color:var(--good, #7fbf8f);">+' + fmt(r.geburten_letzte_runde) + ' geboren</strong> · <strong style="color:var(--danger);">−' + fmt(r.tote_letzte_runde) + ' verstorben</strong>' + (r.zuwanderer_letzte_runde > 0 ? ' · <strong style="color:var(--good, #7fbf8f);">+' + fmt(r.zuwanderer_letzte_runde) + ' zugewandert</strong>' : '') + (r.auswanderer_letzte_runde > 0 ? ' · <strong style="color:var(--danger);">−' + fmt(r.auswanderer_letzte_runde) + ' abgewandert</strong>' : '') + '</p>';
    html += '<p class="panel-sub">Infrastruktur-Versorgung: <strong>' + Math.round(r.versorgungsgrad_letzte_runde * 100) + '%</strong> · Bildung: <strong>' + Math.round(r.bildungsquote_letzte_runde * 100) + '%</strong> (+' + Math.round(r.bildungsquote_letzte_runde * 30) + '% Produktivität)</p>';

    var verkaufsPreisProHa = ((1 + r.bevoelkerung / 1000) * 0.9).toFixed(2);
    html += '<div style="margin-top:16px;"><label style="display:block; font-size:12px; color:var(--muted); margin-bottom:6px;">Land — Kaufen ' + preisProHa + ' / Verkaufen ' + verkaufsPreisProHa + ' Taler/ha</label>';
    html += '<div style="display:flex; gap:8px;"><input type="number" id="land-hektar" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="buy-land-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Kaufen</button>';
    html += '<button class="btn-secondary" id="sell-land-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Verkaufen</button></div>';
    html += '<div class="msg" id="land-msg"></div></div>';

    html += '<div style="margin-top:16px;"><label style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;">Steuersatz <span id="tax-value">' + r.steuersatz + '%</span></label>';
    html += '<input type="range" id="tax-slider" min="1" max="50" value="' + r.steuersatz + '" style="width:100%;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<p class="panel-sub" style="margin-top:6px;">Steuern kommen aus Land und Bevölkerung — je mehr Einwohner, desto mehr Einnahmen insgesamt, aber die Last pro Kopf sinkt. Hohe Sätze senken trotzdem die Geburtenrate und die Zufriedenheit.</p>';
    html += '<button class="btn-secondary" id="tax-save-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Steuersatz übernehmen</button>';
    html += '<div class="msg" id="tax-msg"></div></div>';

    html += '<div style="margin-top:16px;"><label style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:6px;">Justiz-Härte <span id="justiz-value">' + fmt(r.justiz_haerte) + '%</span></label>';
    html += '<input type="range" id="justiz-slider" min="0" max="100" value="' + r.justiz_haerte + '" style="width:100%;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<p class="panel-sub" style="margin-top:6px;">Harte Justiz hält Diebe in Schach, auch wenn du wenig Soldaten hast. Lasche Justiz ohne genug Soldaten führt zu Diebstahl aus deinem Getreidespeicher.</p>';
    html += '<button class="btn-secondary" id="justiz-save-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Justiz-Härte übernehmen</button>';
    html += '<div class="msg" id="justiz-msg"></div></div>';
    html += '</div>';

    // Bank
    html += '<div class="panel"><h2>Bank</h2><p class="panel-sub">Kredit bis zur Höhe deines Landes (' + fmt(r.land_hektar) + ' Taler). Reicht dein Taler nicht, wächst die Schuld weiter.</p>';
    html += '<h3 style="font-family:\'Cinzel\',serif; font-size:14px; margin:0 0 8px;">Kredit — 5% Zinsen</h3>';
    html += '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">';
    html += stat('Schulden', fmt(r.schulden));
    html += stat('Zinsen letzte Runde', fmt(r.zinsen_letzte_runde));
    html += '</div>';
    html += '<div style="display:flex; gap:8px; margin-bottom:8px;"><input type="number" id="kredit-betrag" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="kredit-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Kredit aufnehmen</button></div>';
    html += '<div style="display:flex; gap:8px;"><input type="number" id="tilgen-betrag" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="tilgen-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Tilgen</button></div>';

    html += '<h3 style="font-family:\'Cinzel\',serif; font-size:14px; margin:16px 0 8px;">Sparbuch — 2,5% Zinsen aufs Guthaben</h3>';
    html += '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">';
    html += stat('Guthaben', fmt(r.sparbuch));
    html += stat('Zinsen letzte Runde', fmt(r.sparbuch_zinsen_letzte_runde));
    html += '</div>';
    html += '<div style="display:flex; gap:8px; margin-bottom:8px;"><input type="number" id="sparbuch-einzahlen-betrag" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="sparbuch-einzahlen-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Einzahlen</button></div>';
    html += '<div style="display:flex; gap:8px;"><input type="number" id="sparbuch-auszahlen-betrag" value="1000" min="1" style="flex:1; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
    html += '<button class="btn-secondary" id="sparbuch-auszahlen-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Auszahlen</button></div>';
    html += '<div class="msg" id="bank-msg"></div></div>';

    html += '</div><div>';


    // Gebäude
    var BUILDING_MAX = { palast: 10, kathedrale: 15 };
    var BEDARF_KAPAZITAET = { hof: 250, markt: 600, muehle: 800 };
    html += '<div class="panel"><h2>Gebäude</h2><p class="panel-sub">Markt erhöht Taler-Einkommen, Mühle die Ernte, Hof liefert Getreide/Holz/Wolle/Eisen/Milch/Fleisch, Waffenschmiede versorgt deine Soldaten, Hafen ermöglicht dir Export nach eigener Wahl, Schule bildet dein Volk und steigert dadurch alle Produktion und Einkommen um bis zu 30%. Palast (10 Stufen) und Kathedrale (15 Stufen) werden Stück für Stück ausgebaut. Reichen Hof/Markt/Mühle nicht für deine Bevölkerung, sinkt ihre Wirkung anteilig.</p>';
    ['hof', 'markt', 'muehle', 'waffenschmiede', 'hafen', 'schule', 'mauer', 'palast', 'kathedrale'].forEach(function (typ) {
      var cost = BUILDING_COSTS[typ];
      var count = state.buildings[typ] || 0;
      var max = BUILDING_MAX[typ];
      var maxedOut = max && count >= max;
      var kap = BEDARF_KAPAZITAET[typ];
      var benoetigt = kap ? Math.ceil(r.bevoelkerung / kap) : null;
      var mangel = benoetigt !== null && count < benoetigt;
      html += '<div class="building-row">';
      html += '<div><div class="b-name">' + BUILDING_LABELS[typ] + '</div><div class="b-cost">' + fmt(cost) + ' Taler' + (benoetigt !== null ? ' · benötigt: ' + benoetigt : '') + '</div></div>';
      html += '<div style="display:flex;align-items:center;gap:14px;">';
      html += '<div class="b-count"' + (mangel ? ' style="color:var(--danger);"' : '') + '>' + count + (max ? ' / ' + max : '') + '</div>';
      html += '<button class="btn-secondary" data-build="' + typ + '"' + (g.status !== 'laufend' || maxedOut ? ' disabled' : '') + '>' + (maxedOut ? 'Fertig' : 'Bauen') + '</button>';
      html += '</div></div>';
    });
    html += '<div class="msg" id="build-msg"></div></div>';

    // Dynastie
    html += '<div class="panel"><h2>Dynastie</h2>';
    if (r.verheiratet) {
      html += '<p class="panel-sub">Verheiratet' + (r.ehepartner_name ? ' mit ' + escapeHtml(r.ehepartner_name) : '') + '. Generation ' + fmt(r.generationen) + '.</p>';
      html += '<div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">';
      html += stat('Erben bereit', fmt(r.kinder));
      html += stat('Runden bis Thronwechsel', fmt(Math.max(0, 20 - r.runden_seit_thronbesteigung)));
      html += '</div><p class="panel-sub" style="margin-top:8px;">Alle 20 Runden übernimmt ein Erbe den Thron — mit kleinem Verlust an Taler und Bevölkerung. Ohne bereitstehenden Erben wird gewartet.</p>';
    } else {
      html += '<p class="panel-sub">Noch unverheiratet. Ohne Ehe entstehen keine Erben, und dein Reich endet mit dir.</p>';
      html += '<input type="text" id="partner-name" maxlength="30" placeholder="Name des Ehepartners (optional)" style="width:100%; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px; margin-bottom:8px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
      html += '<button class="btn-primary" id="marry-btn" style="margin-top:0; width:auto; padding:9px 18px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Heiraten</button>';
    }
    html += '<div class="msg" id="marry-msg"></div></div>';

    // Hafen
    var hafenCount = state.buildings.hafen || 0;
    html += '<div class="panel"><h2>Hafen</h2>';
    if (hafenCount < 1) {
      html += '<p class="panel-sub">Baue einen Hafen, um Getreide, Holz, Wolle, Eisen, Milch und Fleisch selbst zu exportieren — Preise schwanken jede Runde.</p>';
    } else {
      html += '<p class="panel-sub">Tagespreise je Einheit — du entscheidest, wie viel du verkaufst.</p>';
      [
        { key: 'getreide', label: 'Getreide', bestand: r.getreide_vorrat },
        { key: 'holz', label: 'Holz', bestand: r.holz },
        { key: 'wolle', label: 'Wolle', bestand: r.wolle },
        { key: 'eisen', label: 'Eisen', bestand: r.eisen },
        { key: 'milch', label: 'Milch', bestand: r.milch },
        { key: 'fleisch', label: 'Fleisch', bestand: r.fleisch }
      ].forEach(function (w) {
        var preis = r['exportpreis_' + w.key];
        var preisVorher = r['exportpreis_' + w.key + '_vorher'];
        var delta = preis - preisVorher;
        var kurs = '';
        if (preisVorher > 0) {
          if (delta > 0) kurs = ' <span style="color:var(--good, #7fbf8f);">▲ +' + fmt(delta) + '</span>';
          else if (delta < 0) kurs = ' <span style="color:var(--danger);">▼ ' + fmt(delta) + '</span>';
          else kurs = ' <span style="color:var(--gold);">●</span>';
        }
        html += '<div class="building-row">';
        html += '<div><div class="b-name">' + w.label + '</div><div class="b-cost">' + fmt(preis) + ' Taler/Einheit' + kurs + ' · Bestand: ' + fmt(w.bestand) + '</div></div>';
        html += '<div style="display:flex;align-items:center;gap:8px;">';
        html += '<input type="number" data-export-menge="' + w.key + '" value="' + Math.min(100, Math.floor(w.bestand)) + '" min="1" style="width:70px; background:#0f0709; border:1px solid var(--border); border-radius:8px; padding:6px 8px; color:var(--text); font-size:12px;"' + (g.status !== 'laufend' ? ' disabled' : '') + '>';
        html += '<button class="btn-secondary" data-export="' + w.key + '"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Exportieren</button>';
        html += '<button data-export-all="' + w.key + '" data-bestand="' + w.bestand + '" title="Alles verkaufen"' + (g.status !== 'laufend' || w.bestand <= 0 ? ' disabled' : '') + ' style="width:22px;height:22px;border-radius:50%;background:#3ecf6e;border:1px solid #2fa85a;cursor:pointer;padding:0;"></button>';
        html += '</div></div>';
      });
      if (r.hafen_einnahmen_letzte_runde > 0) {
        html += '<p class="panel-sub" style="margin-top:8px;">Diese Runde bereits exportiert: <strong style="color:var(--good, #7fbf8f);">+' + fmt(r.hafen_einnahmen_letzte_runde) + ' Taler</strong></p>';
      }
    }
    html += '<div class="msg" id="hafen-msg"></div></div>';

    html += '</div><div>';

    // Militär
    var soldatenBedarf = Math.ceil(r.bevoelkerung / 40);
    html += '<div class="panel"><h2>Militär</h2><p class="panel-sub">50 Taler je Soldat. Für Ordnung und Sicherheit wird 1 Soldat pro 40 Einwohner benötigt (aktuell: ' + soldatenBedarf + ') — sonst steigt die Zahl der Diebe. Jeder Soldat verbraucht 0,2 Holz + 0,3 Eisen pro Runde — eine Waffenschmiede hält die Truppe versorgt und verbessert ihre Ausrüstung. Fehlt Nachschub, desertieren Soldaten.</p>';
    html += '<div class="stat-grid" style="margin-bottom:14px;">';
    html += stat('Soldaten', fmt(state.military.soldaten));
    html += stat('Ausrüstung', 'Stufe ' + state.military.ausruestung_level);
    html += '</div>';
    html += '<div class="recruit-row"><input type="number" id="recruit-count" value="10" min="1">';
    html += '<button class="btn-primary" id="recruit-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Anwerben</button></div>';
    html += '<div class="msg" id="recruit-msg"></div></div>';

    // Marktplatz
    var realmNameById = {};
    state.players.forEach(function (p) { if (p.realms) realmNameById[p.realms.id] = p.reich_name; });

    html += '<div class="panel"><h2>Marktplatz</h2><p class="panel-sub">Angebote anderer Reiche annehmen oder eigenes einstellen.</p>';
    html += '<div class="trade-form">';
    html += '<div class="field"><label>Ware</label><select id="trade-ware"><option value="getreide">Getreide</option><option value="holz">Holz</option><option value="wolle">Wolle</option><option value="eisen">Eisen</option><option value="milch">Milch</option><option value="fleisch">Fleisch</option></select></div>';
    html += '<div class="field"><label>Menge</label><input type="number" id="trade-menge" value="100" min="1"></div>';
    html += '<div class="field"><label>Preis je Einheit (Taler)</label><input type="number" id="trade-preis" value="1" min="0" step="0.1"></div>';
    html += '<button class="btn-secondary" id="offer-btn"' + (g.status !== 'laufend' ? ' disabled' : '') + '>Anbieten</button>';
    html += '</div>';

    var myOffers = state.trades.filter(function (t) { return t.from_realm_id === state.myRealm.id; });
    var otherOffers = state.trades.filter(function (t) { return t.from_realm_id !== state.myRealm.id; });

    if (!state.trades.length) {
      html += '<div class="empty">Aktuell keine offenen Angebote.</div>';
    } else {
      otherOffers.forEach(function (t) {
        html += tradeRow(t, realmNameById, true);
      });
      myOffers.forEach(function (t) {
        html += tradeRow(t, realmNameById, false);
      });
    }
    html += '<div class="msg" id="trade-msg"></div></div>';

    // Karte
    var maxX = 0, maxY = 0;
    state.players.forEach(function (p) { if (p.realms) { maxX = Math.max(maxX, p.realms.karte_x); maxY = Math.max(maxY, p.realms.karte_y); } });
    var grid = {};
    state.players.forEach(function (p) { if (p.realms) grid[p.realms.karte_x + ',' + p.realms.karte_y] = p; });
    function allianzZwischen(idA, idB) {
      return state.allianzen.find(function (a) { return (a.realm_a_id === idA && a.realm_b_id === idB) || (a.realm_a_id === idB && a.realm_b_id === idA); });
    }

    html += '<div class="panel"><h2>Karte</h2><p class="panel-sub">Angrenzende Reiche kannst du angreifen oder um eine Allianz bitten.</p>';
    html += '<div style="display:grid; grid-template-columns:repeat(' + (maxX + 1) + ', 1fr); gap:8px; max-width:360px;">';
    for (var gy = 0; gy <= maxY; gy++) {
      for (var gx = 0; gx <= maxX; gx++) {
        var cellP = grid[gx + ',' + gy];
        var isSelfCell = cellP && cellP.id === state.myPlayer.id;
        var isAdj = state.myRealm && (Math.abs(gx - state.myRealm.karte_x) + Math.abs(gy - state.myRealm.karte_y)) === 1;
        html += '<div class="karte-zelle' + (isSelfCell ? ' self' : '') + (isAdj && cellP ? ' adjacent' : '') + '">';
        if (cellP) {
          var cCrest = cellP.factions ? '<img src="assets/factions/' + cellP.factions.bild_datei + '" style="width:20px;height:25px;border-radius:3px;">' : '';
          html += cCrest + '<div style="font-size:11px;margin-top:2px;">' + escapeHtml(cellP.reich_name) + (isSelfCell ? ' (du)' : '') + '</div>';
          if (isAdj && !isSelfCell && g.status === 'laufend') {
            var allianz = allianzZwischen(state.myRealm.id, cellP.realms.id);
            if (allianz && allianz.status === 'aktiv') {
              html += '<button class="btn-secondary" data-allianz-aufloesen="' + allianz.id + '" style="font-size:10px;padding:3px 6px;margin-top:4px;">Lösen</button>';
            } else if (allianz && allianz.status === 'angefragt') {
              html += '<span style="font-size:10px;color:var(--muted);">Anfrage offen</span>';
            } else {
              html += '<button class="btn-secondary" data-angreifen="' + cellP.realms.id + '" style="font-size:10px;padding:3px 6px;margin-top:4px;">Angreifen</button>';
              html += '<button class="btn-secondary" data-allianz-anfragen="' + cellP.realms.id + '" style="font-size:10px;padding:3px 6px;margin-top:2px;">Allianz</button>';
            }
          }
        }
        html += '</div>';
      }
    }
    html += '</div>';

    var eingehend = state.allianzen.filter(function (a) { return a.status === 'angefragt' && a.realm_b_id === state.myRealm.id; });
    if (eingehend.length) {
      html += '<div style="margin-top:14px;">';
      eingehend.forEach(function (a) {
        var vonPlayer = state.players.find(function (p) { return p.realms && p.realms.id === a.realm_a_id; });
        html += '<div class="trade-row"><span>Allianz-Anfrage von ' + escapeHtml(vonPlayer ? vonPlayer.reich_name : '?') + '</span>';
        html += '<div><button class="btn-primary" data-allianz-annehmen="' + a.id + '" style="padding:6px 12px;font-size:12px;">Annehmen</button> ';
        html += '<button class="btn-secondary" data-allianz-ablehnen="' + a.id + '" style="padding:6px 12px;font-size:12px;">Ablehnen</button></div></div>';
      });
      html += '</div>';
    }
    html += '<div class="msg" id="karte-msg"></div></div>';

    // Andere Reiche
    html += '<div class="panel"><h2>Reiche in dieser Partie</h2><div class="realm-list">';
    state.players.forEach(function (p) {
      var isSelf = p.id === state.myPlayer.id;
      html += '<div class="realm-row' + (isSelf ? ' self' : '') + '">';
      var crest = p.factions ? '<img src="assets/factions/' + p.factions.bild_datei + '" alt="" style="width:22px;height:27px;border-radius:3px;vertical-align:middle;margin-right:8px;">' : '';
      html += '<span class="r-name">' + crest + escapeHtml(p.reich_name) + (isSelf ? ' (du)' : '') + '</span>';
      html += '<span class="r-rank">' + (p.realms ? (RANK_LABELS[p.realms.rang] || p.realms.rang) : '') + '</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div>';

    html += '</div></div>';

    main.innerHTML = html;
    bindActions();
  }

  function tradeRow(t, realmNameById, showAccept) {
    var WARE_LABELS = { getreide: 'Getreide', holz: 'Holz', wolle: 'Wolle', eisen: 'Eisen', milch: 'Milch', fleisch: 'Fleisch' };
    var wareLabel = WARE_LABELS[t.ware] || t.ware;
    var priceText = t.preis ? (' · ' + fmt(t.preis) + ' Taler/Einheit') : '';
    var html = '<div class="trade-row">';
    html += '<div><div class="t-desc"><strong>' + fmt(t.menge) + ' ' + wareLabel + '</strong>' + priceText + '</div>';
    html += '<div class="t-from">von ' + escapeHtml(realmNameById[t.from_realm_id] || 'Unbekannt') + '</div></div>';
    if (showAccept) {
      html += '<button class="btn-primary" style="padding:6px 14px;font-size:12px;" data-accept="' + t.id + '">Annehmen</button>';
    } else {
      html += '<span class="t-from">eigenes Angebot</span>';
    }
    html += '</div>';
    return html;
  }

  function stat(label, value) {
    return '<div class="stat"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
  }

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  var BUILDING_COSTS = { markt: 500, muehle: 400, hof: 600, waffenschmiede: 700, hafen: 800, schule: 900, mauer: 300, palast: 5000, kathedrale: 4000 };

  function bindActions() {
    var marryBtn = document.getElementById('marry-btn');
    if (marryBtn) {
      marryBtn.addEventListener('click', function () {
        var partnerName = document.getElementById('partner-name').value;
        marryBtn.disabled = true;
        sb.rpc('marry', { p_realm_id: state.myRealm.id, p_partner_name: partnerName }).then(function (res) {
          var msg = document.getElementById('marry-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            marryBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
    var buyLandBtn = document.getElementById('buy-land-btn');
    if (buyLandBtn) {
      buyLandBtn.addEventListener('click', function () {
        var hektar = parseFloat(document.getElementById('land-hektar').value) || 0;
        buyLandBtn.disabled = true;
        sb.rpc('buy_land', { p_realm_id: state.myRealm.id, p_hektar: hektar }).then(function (res) {
          var msg = document.getElementById('land-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            buyLandBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
    var sellLandBtn = document.getElementById('sell-land-btn');
    if (sellLandBtn) {
      sellLandBtn.addEventListener('click', function () {
        var hektar = parseFloat(document.getElementById('land-hektar').value) || 0;
        sellLandBtn.disabled = true;
        sb.rpc('sell_land', { p_realm_id: state.myRealm.id, p_hektar: hektar }).then(function (res) {
          var msg = document.getElementById('land-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            sellLandBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
    var taxSlider = document.getElementById('tax-slider');
    var taxSaveBtn = document.getElementById('tax-save-btn');
    if (taxSlider) {
      taxSlider.addEventListener('input', function () {
        document.getElementById('tax-value').textContent = taxSlider.value + '%';
      });
    }
    if (taxSaveBtn) {
      taxSaveBtn.addEventListener('click', function () {
        taxSaveBtn.disabled = true;
        sb.rpc('set_tax_rate', { p_realm_id: state.myRealm.id, p_rate: parseInt(taxSlider.value, 10) }).then(function (res) {
          var msg = document.getElementById('tax-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            taxSaveBtn.disabled = false;
            return;
          }
          msg.textContent = 'Steuersatz übernommen — wirkt ab der nächsten Runde.';
          msg.className = 'msg success';
          state.myRealm.steuersatz = parseInt(taxSlider.value, 10);
          taxSaveBtn.disabled = false;
        });
      });
    }

    var justizSlider = document.getElementById('justiz-slider');
    var justizSaveBtn = document.getElementById('justiz-save-btn');
    if (justizSlider) {
      justizSlider.addEventListener('input', function () {
        document.getElementById('justiz-value').textContent = justizSlider.value + '%';
      });
    }
    if (justizSaveBtn) {
      justizSaveBtn.addEventListener('click', function () {
        justizSaveBtn.disabled = true;
        sb.rpc('set_justiz_haerte', { p_realm_id: state.myRealm.id, p_haerte: parseInt(justizSlider.value, 10) }).then(function (res) {
          var msg = document.getElementById('justiz-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            justizSaveBtn.disabled = false;
            return;
          }
          msg.textContent = 'Justiz-Härte übernommen — wirkt ab der nächsten Runde.';
          msg.className = 'msg success';
          justizSaveBtn.disabled = false;
        });
      });
    }

    var kreditBtn = document.getElementById('kredit-btn');
    if (kreditBtn) {
      kreditBtn.addEventListener('click', function () {
        var betrag = parseFloat(document.getElementById('kredit-betrag').value) || 0;
        kreditBtn.disabled = true;
        sb.rpc('bank_kredit_aufnehmen', { p_realm_id: state.myRealm.id, p_betrag: betrag }).then(function (res) {
          var msg = document.getElementById('bank-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            kreditBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
    var tilgenBtn = document.getElementById('tilgen-btn');
    if (tilgenBtn) {
      tilgenBtn.addEventListener('click', function () {
        var betrag = parseFloat(document.getElementById('tilgen-betrag').value) || 0;
        tilgenBtn.disabled = true;
        sb.rpc('bank_kredit_tilgen', { p_realm_id: state.myRealm.id, p_betrag: betrag }).then(function (res) {
          var msg = document.getElementById('bank-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            tilgenBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }

    document.querySelectorAll('[data-export]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var ware = btn.getAttribute('data-export');
        var mengeInput = document.querySelector('[data-export-menge="' + ware + '"]');
        var menge = parseFloat(mengeInput.value) || 0;
        btn.disabled = true;
        sb.rpc('hafen_exportieren', { p_realm_id: state.myRealm.id, p_ware: ware, p_menge: menge }).then(function (res) {
          var msg = document.getElementById('hafen-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    });

    document.querySelectorAll('[data-export-all]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var ware = btn.getAttribute('data-export-all');
        var menge = parseFloat(btn.getAttribute('data-bestand')) || 0;
        if (menge <= 0) return;
        btn.disabled = true;
        sb.rpc('hafen_exportieren', { p_realm_id: state.myRealm.id, p_ware: ware, p_menge: Math.floor(menge) }).then(function (res) {
          var msg = document.getElementById('hafen-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    });

    var sparbuchEinzahlenBtn = document.getElementById('sparbuch-einzahlen-btn');
    if (sparbuchEinzahlenBtn) {
      sparbuchEinzahlenBtn.addEventListener('click', function () {
        var betrag = parseFloat(document.getElementById('sparbuch-einzahlen-betrag').value) || 0;
        sparbuchEinzahlenBtn.disabled = true;
        sb.rpc('sparbuch_einzahlen', { p_realm_id: state.myRealm.id, p_betrag: betrag }).then(function (res) {
          var msg = document.getElementById('bank-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            sparbuchEinzahlenBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
    var sparbuchAuszahlenBtn = document.getElementById('sparbuch-auszahlen-btn');
    if (sparbuchAuszahlenBtn) {
      sparbuchAuszahlenBtn.addEventListener('click', function () {
        var betrag = parseFloat(document.getElementById('sparbuch-auszahlen-betrag').value) || 0;
        sparbuchAuszahlenBtn.disabled = true;
        sb.rpc('sparbuch_auszahlen', { p_realm_id: state.myRealm.id, p_betrag: betrag }).then(function (res) {
          var msg = document.getElementById('bank-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            sparbuchAuszahlenBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }

    var startBtn = document.getElementById('start-btn');
    if (startBtn) {
      startBtn.addEventListener('click', function () {
        startBtn.disabled = true;
        sb.rpc('start_game', { p_game_id: gameId }).then(function (res) {
          var msg = document.getElementById('action-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            startBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }

    document.querySelectorAll('[data-build]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var typ = btn.getAttribute('data-build');
        btn.disabled = true;
        sb.rpc('build_building', { p_realm_id: state.myRealm.id, p_typ: typ }).then(function (res) {
          var msg = document.getElementById('build-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    });

    var recruitBtn = document.getElementById('recruit-btn');
    if (recruitBtn) {
      recruitBtn.addEventListener('click', function () {
        var count = parseInt(document.getElementById('recruit-count').value, 10) || 0;
        recruitBtn.disabled = true;
        sb.rpc('recruit_soldiers', { p_realm_id: state.myRealm.id, p_anzahl: count }).then(function (res) {
          var msg = document.getElementById('recruit-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            recruitBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }

    var offerBtn = document.getElementById('offer-btn');
    if (offerBtn) {
      offerBtn.addEventListener('click', function () {
        var ware = document.getElementById('trade-ware').value;
        var menge = parseFloat(document.getElementById('trade-menge').value) || 0;
        var preis = parseFloat(document.getElementById('trade-preis').value) || 0;
        offerBtn.disabled = true;
        sb.rpc('offer_trade', { p_game_id: gameId, p_ware: ware, p_menge: menge, p_preis: preis }).then(function (res) {
          var msg = document.getElementById('trade-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            offerBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }

    document.querySelectorAll('[data-accept]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var tradeId = btn.getAttribute('data-accept');
        btn.disabled = true;
        sb.rpc('accept_trade', { p_trade_id: tradeId }).then(function (res) {
          var msg = document.getElementById('trade-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    });

    document.querySelectorAll('[data-angreifen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('Diesen Nachbarn wirklich angreifen?')) return;
        var zielId = btn.getAttribute('data-angreifen');
        btn.disabled = true;
        sb.rpc('angreifen', { p_realm_id: state.myRealm.id, p_ziel_realm_id: zielId }).then(function (res) {
          var msg = document.getElementById('karte-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          var d = res.data;
          msg.textContent = d.sieg
            ? 'Sieg! ' + d.land_beute + ' ha und ' + d.taler_beute + ' Taler erobert.'
            : 'Niederlage — der Angriff wurde zurückgeschlagen.';
          msg.className = d.sieg ? 'msg success' : 'msg error';
          loadAll();
        });
      });
    });

    document.querySelectorAll('[data-allianz-anfragen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var zielId = btn.getAttribute('data-allianz-anfragen');
        btn.disabled = true;
        sb.rpc('allianz_anfragen', { p_realm_id: state.myRealm.id, p_ziel_realm_id: zielId }).then(function (res) {
          var msg = document.getElementById('karte-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            btn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    });

    document.querySelectorAll('[data-allianz-annehmen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-allianz-annehmen');
        btn.disabled = true;
        sb.rpc('allianz_antworten', { p_allianz_id: id, p_annehmen: true }).then(function () { loadAll(); });
      });
    });
    document.querySelectorAll('[data-allianz-ablehnen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-allianz-ablehnen');
        btn.disabled = true;
        sb.rpc('allianz_antworten', { p_allianz_id: id, p_annehmen: false }).then(function () { loadAll(); });
      });
    });
    document.querySelectorAll('[data-allianz-aufloesen]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!confirm('Allianz wirklich auflösen?')) return;
        var id = btn.getAttribute('data-allianz-aufloesen');
        btn.disabled = true;
        sb.rpc('allianz_aufloesen', { p_allianz_id: id }).then(function () { loadAll(); });
      });
    });

    var advanceBtn = document.getElementById('advance-btn');
    if (advanceBtn) {
      advanceBtn.addEventListener('click', function () {
        advanceBtn.disabled = true;
        sb.rpc('advance_round', { p_game_id: gameId }).then(function (res) {
          var msg = document.getElementById('advance-msg');
          if (res.error) {
            msg.textContent = res.error.message;
            msg.className = 'msg error';
            advanceBtn.disabled = false;
            return;
          }
          loadAll();
        });
      });
    }
  }

  sb.auth.getSession().then(function (res) {
    if (!res.data.session) {
      window.location.href = 'index.html';
      return;
    }
    loadAll();
  });
})();
</script>
</body>
</html>
