<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaiser — driftware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12080b;
  --card: #1c1013;
  --border: #3a1f26;
  --text: #f7ecd9;
  --muted: #b89a86;
  --gold: #d4af37;
  --wine: #8a1538;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at 50% 30%, #1c0d12, var(--bg) 70%);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  text-align: center;
  padding: 24px;
}
.wrap { max-width: 520px; }
.crown { font-size: 48px; margin-bottom: 12px; }
.badge {
  display: inline-block;
  font-size: 12px;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--border);
  background: rgba(212,175,55,.08);
  padding: 5px 12px;
  border-radius: 999px;
  margin-bottom: 18px;
}
h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(30px, 6vw, 44px);
  margin: 0 0 14px;
  background: linear-gradient(135deg, var(--gold), #f5d97a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
p {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
  margin: 0 0 28px;
}
a.home {
  display: inline-block;
  color: var(--gold);
  text-decoration: none;
  font-size: 14px;
  border-bottom: 1px solid transparent;
}
a.home:hover { border-bottom-color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
<div class="crown">👑</div>
<span class="badge">Bald verfügbar</span>
<h1>Kaiser</h1>
<p>Wirtschafts- und Aufbaustrategie im Online-Multiplayer. Bis zu sechs Spieler ringen um Land, Handel und die Kaiserkrone — solo oder gegeneinander. Hier entsteht gerade die Neuauflage des Klassikers.</p>
<a class="home" href="/">← Zurück zu driftware</a>
</div>
</body>
</html>
